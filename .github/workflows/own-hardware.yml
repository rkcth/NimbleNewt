name: Own hardware

# Runs on the owner's own machines (self-hosted runners), started by hand from the Actions tab and only from main.
# It never runs on a push or a pull request: this repository is public, and a runner on a personal machine must not execute code
# from anyone else's branch or fork. Today it only checks that each runner works and records what the machine is (the probe);
# the sandbox and containment checks (cards A03, A04, G05) are added as further jobs here once those cards exist (`sandbox-windows` is the first: card A03b).
# This file's guards do not protect a runner from OTHER workflow files: see docs/nimblenewt/own-hardware-runners.md.
# Runner labels: `nimblenewt-mac`, `nimblenewt-windows`, `nimblenewt-linux` (see docs/nimblenewt/own-hardware-runners.md).
on:
  workflow_dispatch:
    inputs:
      g05_owner_bundle:
        description: "Run ONLY the G05 owner bundle (run-g05.ps1: the ten containment cases, AppContainer) on the Windows runner as its signed-in, non-elevated account; the probe and Windows Sandbox jobs are skipped. Leave off for the usual run."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: own-hardware
  cancel-in-progress: false

jobs:
  probe:
    name: Probe ${{ matrix.label }}
    if: github.repository == 'rkcth/NimbleNewt' && github.ref == 'refs/heads/main' && inputs.g05_owner_bundle != true
    runs-on: [self-hosted, "${{ matrix.label }}"]
    # One run of the whole suite takes about 21 minutes on the Mac and about twice that on the Windows runner, and a slow Windows run was
    # cancelled at 60 minutes part way through (CI, 2026-11-19). One limit for both machines: the Mac finishes far below it.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        label: [nimblenewt-mac, nimblenewt-windows]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Windows: a plain `shell: bash` can resolve to C:\Windows\System32\bash.exe (the WSL launcher), which loses the backslashes of
      # the runner's script path, so no step runs (GitHub run 44453704944). This step puts Git for Windows' bash first on the PATH for
      # the rest of the job, so every later `shell: bash` step uses Git Bash. A `shell:` line naming "C:\Program Files\Git\bin\bash.exe"
      # directly does not work: the runner splits that line at its first space. See docs/nimblenewt/own-hardware-runners.md.
      - name: Use Git Bash for bash steps
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @()
          $git = Get-Command git.exe -CommandType Application -ErrorAction SilentlyContinue | Select-Object -First 1
          # git.exe is usually in Git\cmd or Git\bin (bash in Git\bin); with Git\mingw64\bin on the PATH, Git\bin is one level higher.
          if ($git) { $root = Split-Path (Split-Path $git.Source -Parent) -Parent; foreach ($r in @($root, (Split-Path $root -Parent))) { if ($r) { $candidates += Join-Path $r 'bin' } } }
          $candidates += Join-Path $env:ProgramFiles 'Git\bin'
          $dir = $candidates | Where-Object { Test-Path -LiteralPath (Join-Path $_ 'bash.exe') } | Select-Object -First 1
          if (-not $dir) { Write-Output "::error::Git Bash (Git for Windows bin\bash.exe) was not found; install Git for Windows (docs/nimblenewt/own-hardware-runners.md)"; exit 1 }
          # No double quotes inside the -c text: Windows PowerShell 5.1 passes them to native programs unescaped.
          & (Join-Path $dir 'bash.exe') --noprofile --norc -c 'echo bash for this job: $BASH $BASH_VERSION'
          if ($LASTEXITCODE -ne 0) { exit 1 }
          [System.IO.File]::AppendAllText($env:GITHUB_PATH, "$dir`n", (New-Object System.Text.UTF8Encoding $false))
      - name: Record the machine
        shell: bash
        # On Windows this is Git Bash (the step above).
        run: |
          echo "## ${{ matrix.label }}" >> "$GITHUB_STEP_SUMMARY"
          { echo '```'; node -p "[process.platform, process.arch, process.version, require('os').release()].join(' ')"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # Install scripts are disabled by .npmrc; the lockfile is authoritative.
      - run: npm ci
      - name: One run of the whole suite
        shell: bash
        run: node scripts/qa.mjs --runs=1 "--out=$RUNNER_TEMP/qa-output"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: own-hardware-${{ matrix.label }}
          path: ${{ runner.temp }}/qa-output
          if-no-files-found: warn
          retention-days: 90

  # Card A03b: the real Windows Sandbox tests (packages/worker/src/sandbox/windows-real.test.ts). Same guards as the probe; only the Windows runner, and only when it is
  # started by hand from main. The artifact holds only a summary (pass/fail, counts, OS build, mode names); detailed output stays on the machine. The tests start real sandboxes and change per-job ACLs under a temporary folder, and remove them afterwards. They never enable auto-login
  # (the auto-login and lock test runs only if the owner sets NIMBLENEWT_REAL_WINDOWS_AUTOLOGON on the runner's own environment, which this file does not do).
  # On the same commit the job then produces, for cards G05, G06 and Y02: the filesystem facts of this machine (G06), the controller working-directory check, the G05 containment report with
  # its `windows` block filled from the summary (REDACTED: account, machine and home names, SIDs and addresses replaced; the unredacted copy stays on the machine), the G06 long-path test,
  # and the Y02 scenario report with the real Windows Sandbox. Every step after the build runs even if an earlier one failed (continue-on-error), so one run gathers everything; the last
  # step lists each outcome in the job summary and fails the job if any of them failed. Nothing here is a sign-off: the evidence is judged by `containment-evidence.mjs gate` and
  # `y02-checkpoint.mjs gate`, which still block on what no automation can show (logout and reboot under the service identity, the strict supervisor ACL, a packaged controller).
  sandbox-windows:
    name: Windows Sandbox (real)
    if: github.repository == 'rkcth/NimbleNewt' && github.ref == 'refs/heads/main' && inputs.g05_owner_bundle != true
    runs-on: [self-hosted, nimblenewt-windows]
    # The Y02 scenario set runs whole controller test files on four storage backends on the owner's PC: allow far more than the Sandbox tests alone need.
    # The job's limit is above the sum of every step's own limit (425 minutes) plus set-up and uploads, so a job timeout never cuts off the cleanup, outcome and upload steps
    # (a self-hosted runner's job may run longer than a hosted one's 360 minutes).
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Windows: a plain `shell: bash` can resolve to C:\Windows\System32\bash.exe (the WSL launcher), which loses the backslashes of
      # the runner's script path, so no step runs (GitHub run 44453704944). This step puts Git for Windows' bash first on the PATH for
      # the rest of the job, so every later `shell: bash` step uses Git Bash. A `shell:` line naming "C:\Program Files\Git\bin\bash.exe"
      # directly does not work: the runner splits that line at its first space. See docs/nimblenewt/own-hardware-runners.md.
      - name: Use Git Bash for bash steps
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @()
          $git = Get-Command git.exe -CommandType Application -ErrorAction SilentlyContinue | Select-Object -First 1
          # git.exe is usually in Git\cmd or Git\bin (bash in Git\bin); with Git\mingw64\bin on the PATH, Git\bin is one level higher.
          if ($git) { $root = Split-Path (Split-Path $git.Source -Parent) -Parent; foreach ($r in @($root, (Split-Path $root -Parent))) { if ($r) { $candidates += Join-Path $r 'bin' } } }
          $candidates += Join-Path $env:ProgramFiles 'Git\bin'
          $dir = $candidates | Where-Object { Test-Path -LiteralPath (Join-Path $_ 'bash.exe') } | Select-Object -First 1
          if (-not $dir) { Write-Output "::error::Git Bash (Git for Windows bin\bash.exe) was not found; install Git for Windows (docs/nimblenewt/own-hardware-runners.md)"; exit 1 }
          # No double quotes inside the -c text: Windows PowerShell 5.1 passes them to native programs unescaped.
          & (Join-Path $dir 'bash.exe') --noprofile --norc -c 'echo bash for this job: $BASH $BASH_VERSION'
          if ($LASTEXITCODE -ne 0) { exit 1 }
          [System.IO.File]::AppendAllText($env:GITHUB_PATH, "$dir`n", (New-Object System.Text.UTF8Encoding $false))
      - run: npm ci
      - run: npm run build
      # G06: what this machine's filesystem is (type, cluster size, long-path and 8.3 settings, case sensitivity of the checkout). No volume label, serial number or user name is recorded.
      - name: Record the filesystem (G06)
        id: fs
        continue-on-error: true
        timeout-minutes: 10
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'g06-host'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          function Try-Get([scriptblock]$b) { try { & $b } catch { 'unknown' } }
          $drive = (Split-Path -Qualifier $env:GITHUB_WORKSPACE).TrimEnd(':')
          $tempDrive = (Split-Path -Qualifier $env:RUNNER_TEMP).TrimEnd(':')
          $vol = Try-Get { Get-Volume -DriveLetter $drive }
          $tempVol = Try-Get { Get-Volume -DriveLetter $tempDrive }
          $os = Try-Get { Get-CimInstance Win32_OperatingSystem }
          $longPaths = Try-Get { (Get-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' -Name LongPathsEnabled).LongPathsEnabled }
          # Only the words enabled or disabled are kept from fsutil's output (its full text can name the checkout's path, which holds the account name).
          # fsutil 8dot3name prints the volume's and the registry's state and then the result ("Based on the above ... settings, 8dot3 name creation is disabled on C:"): when that
          # result line is there it alone is read, since the first two can disagree with it.
          function State([string]$t) { $r = ($t -split "`r?`n") | Where-Object { $_ -match 'Based on the above' } | Select-Object -First 1; if ($r) { $t = $r }; if ($t -match 'is disabled|: disabled') { 'disabled' } elseif ($t -match 'is enabled|: enabled') { 'enabled' } else { 'unknown' } }
          $short = Try-Get { State (fsutil 8dot3name query "$($drive):" | Out-String) }
          $case = Try-Get { State (fsutil file queryCaseSensitiveInfo "$env:GITHUB_WORKSPACE" | Out-String) }
          $facts = [ordered]@{
            schema = 'nimblenewt.g06-host/1'
            commit = "$env:GITHUB_SHA"
            os = [ordered]@{ caption = Try-Get { $os.Caption }; version = Try-Get { $os.Version }; build = Try-Get { $os.BuildNumber }; architecture = Try-Get { $os.OSArchitecture } }
            node = (node -p 'process.version')
            checkoutVolume = [ordered]@{ fileSystem = Try-Get { $vol.FileSystemType }; driveType = Try-Get { "$($vol.DriveType)" }; allocationUnitSize = Try-Get { $vol.AllocationUnitSize } }
            tempVolume = [ordered]@{ fileSystem = Try-Get { $tempVol.FileSystemType }; driveType = Try-Get { "$($tempVol.DriveType)" }; sameAsCheckout = ($drive -eq $tempDrive) }
            longPathsEnabled = $longPaths
            shortNames8dot3 = $short
            checkoutCaseSensitivity = $case
          }
          $json = $facts | ConvertTo-Json -Depth 4
          [System.IO.File]::WriteAllText((Join-Path $out 'g06-host.json'), $json, (New-Object System.Text.UTF8Encoding $false))
          # UTF-8 without a byte-order mark (Add-Content -Encoding utf8 in Windows PowerShell 5.1 writes one).
          [System.IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, "## G06: this machine's filesystem`n``````json`n$json`n```````n", (New-Object System.Text.UTF8Encoding $false))
          # The step's exit status is not left to whichever native program (fsutil) ran last.
          exit 0
      # Diagnostic only (card wsb-console): what this job's own process looks like before its first `wsb` call (account kind, integrity level, session, console, job object,
      # parents and service, window station and desktop, environment variable NAMES) and one `wsb list` with a 45 s limit, to compare with the same call made by hand.
      # Then (card wsb-variants) `wsb list` once in each of six other ways (node detached, cmd with NUL and files, powershell -Command, a new console, a one-shot scheduled task
      # at run level Limited (the verdict-bearing one) and the same task at Highest for comparison, each removed afterwards), 45 s each and under 460 s in all
      # (scripts/wsb-launch-variants.mjs), appended to the same record.
      # Fixed words only, through the credential scanner and the log redaction; both always exit 0 and the outcome step does not read them.
      # 15 minutes: the context script stops itself at 240 s and the variants at 460 s (plus a minute for starting node).
      - name: Record the job's process context before wsb
        id: wsbctx
        continue-on-error: true
        timeout-minutes: 15
        shell: bash
        run: |
          node scripts/wsb-job-context.mjs 2>&1 | node scripts/redact-log.mjs > "$RUNNER_TEMP/wsb-job-context.txt"
          node scripts/wsb-launch-variants.mjs 2>&1 | node scripts/redact-log.mjs >> "$RUNNER_TEMP/wsb-job-context.txt"
          cat "$RUNNER_TEMP/wsb-job-context.txt"
          { echo "## The job's process context before wsb (diagnostic)"; echo '```'; cat "$RUNNER_TEMP/wsb-job-context.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # Card wsb-repair: the product's own launcher now runs every `wsb` command through a one-shot scheduled task in the signed-in session (the one way that answered in run 45097817234),
      # with the direct call only when the task provably did not start. This step prints ONE line: what that launcher tried for `wsb list` and how it ended (scripts/wsb-list-line.mjs).
      # Fixed words only, through the log redaction; it always exits 0 and the outcome step does not read it. 25 minutes: a list that does not answer is tried up to three times.
      - name: What the product's launcher tried for wsb list, in one line
        id: wsblist
        continue-on-error: true
        timeout-minutes: 25
        shell: bash
        run: |
          node scripts/wsb-list-line.mjs 2>&1 | node scripts/redact-log.mjs | tee "$RUNNER_TEMP/wsb-list-line.txt"
          { echo "## wsb list through the product's launcher (diagnostic)"; echo '```'; cat "$RUNNER_TEMP/wsb-list-line.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Run the real Windows Sandbox tests
        id: wsb
        continue-on-error: true
        # Step timeouts: a stuck step ends with a failure and the later steps (the cleanup, the outcome, the uploads) still run inside the job's limit.
        timeout-minutes: 90
        shell: bash
        env:
          NIMBLENEWT_REAL_WINDOWS_SANDBOX: "1"
          # The checkout is writable by the runner's account, so the strict supervisor-ACL rule cannot pass here; the test records whether it would.
          NIMBLENEWT_WSB_SUPERVISOR_ACL: report-only
          # Only summary.json (pass/fail, counts, OS build, mode names) is uploaded: the repository is public. Everything detailed stays in the local folder on the machine.
          NIMBLENEWT_WSB_OUT: ${{ runner.temp }}/sandbox-windows
          NIMBLENEWT_WSB_LOCAL: ${{ runner.temp }}/sandbox-windows-local
          # A failing test also writes a redacted detail here (names, home directories and SIDs replaced; output cut to 2 KiB); it is uploaded separately with a short retention.
          NIMBLENEWT_WSB_DETAIL: ${{ runner.temp }}/sandbox-windows-detail
        run: |
          set -o pipefail
          mkdir -p "$NIMBLENEWT_WSB_OUT" "$NIMBLENEWT_WSB_LOCAL" "$NIMBLENEWT_WSB_DETAIL"
          node --import ./scripts/offline-guard.mjs --test --test-timeout=1500000 --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination="$NIMBLENEWT_WSB_LOCAL/junit.xml" packages/worker/dist/sandbox/windows-real.test.js > "$NIMBLENEWT_WSB_LOCAL/output.txt" 2>&1 || { echo "the real Windows Sandbox tests failed; see the redacted detail artifact"; exit 1; }
      # G05: the working directory the controller of an installed release gets when the scheduled task (the Windows service unit) starts the launcher. The release's entry is a stand-in, so the
      # result says packaged: false (scripts/g05-workdir-check.mjs). Its output holds booleans and fixed texts only.
      - name: Controller working-directory check (G05)
        id: wd
        continue-on-error: true
        timeout-minutes: 10
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/g05-local"
          node scripts/g05-workdir-check.mjs --out "$RUNNER_TEMP/g05-local/workdir.json" 2>&1 | tee "$RUNNER_TEMP/g05-local/workdir.log" | node scripts/redact-log.mjs
      # G05: the containment suite through the production launcher with the Windows Sandbox backend, with the `windows` block filled from the Sandbox tests' summary and the check above.
      # Only the REDACTED report is uploaded (the repository is public); the unredacted one stays in the local folder on the machine. The supervisor-ACL rule is report-only for the same
      # reason as the tests above (the checkout is writable by the runner's account), so the report says report-only and the gate keeps blocking on the strict check.
      - name: G05 containment, redacted
        id: g05
        continue-on-error: true
        timeout-minutes: 60
        shell: bash
        env:
          NIMBLENEWT_WSB_SUPERVISOR_ACL: report-only
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/g05-windows" "$RUNNER_TEMP/g05-local"
          EXTRA=()
          if [ -f "$RUNNER_TEMP/sandbox-windows/summary.json" ]; then EXTRA+=(--windows-summary "$RUNNER_TEMP/sandbox-windows/summary.json"); if [ -f "$RUNNER_TEMP/g05-local/workdir.json" ]; then EXTRA+=(--workdir-check "$RUNNER_TEMP/g05-local/workdir.json"); fi; else echo "no Sandbox summary: the report has no windows block"; fi
          node --import ./scripts/offline-guard.mjs scripts/containment-evidence.mjs run --out "$RUNNER_TEMP/g05-windows" "${EXTRA[@]}" --redact --local "$RUNNER_TEMP/g05-local" 2>&1 | tee "$RUNNER_TEMP/g05-local/g05.log" | node scripts/redact-log.mjs
      # G06: paths over 260 characters on this machine's real filesystem (packages/worker/src/workspace/long-paths.test.ts; the Windows-only test runs here).
      - name: G06 long paths on this machine
        id: g06
        continue-on-error: true
        timeout-minutes: 30
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/g06-host"
          node --import ./scripts/offline-guard.mjs --test --test-timeout=600000 packages/worker/dist/workspace/long-paths.test.js 2>&1 | tee "$RUNNER_TEMP/g06-local.log" | node scripts/redact-log.mjs
          grep -E "^# (tests|pass|fail|cancelled|skipped|todo) " "$RUNNER_TEMP/g06-local.log" > "$RUNNER_TEMP/g06-host/long-paths-counts.txt" || true
      # Y02: the scenario set with the real Windows Sandbox (scripts/y02-checkpoint.mjs run). Its report holds counts, the commit and the OS type only. The Sandbox tests it runs write their
      # summary and findings to folders of their own here, so they do not replace the summary uploaded above.
      - name: Y02 scenarios with the real Windows Sandbox
        id: y02
        continue-on-error: true
        timeout-minutes: 150
        shell: bash
        env:
          NIMBLENEWT_REAL_WINDOWS_SANDBOX: "1"
          NIMBLENEWT_WSB_SUPERVISOR_ACL: report-only
          NIMBLENEWT_WSB_OUT: ${{ runner.temp }}/y02-wsb-local/summary
          NIMBLENEWT_WSB_LOCAL: ${{ runner.temp }}/y02-wsb-local/findings
          NIMBLENEWT_WSB_DETAIL: ${{ runner.temp }}/y02-wsb-local/detail
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/y02-windows" "$RUNNER_TEMP/y02-wsb-local"
          node scripts/y02-checkpoint.mjs run --out "$RUNNER_TEMP/y02-windows" 2>&1 | tee "$RUNNER_TEMP/y02-wsb-local/y02.log" | node scripts/redact-log.mjs
      # What a step stopped by its timeout (or a cancelled run) left behind: each leftover job's sandbox is stopped and its access lists restored through the backend's own release
      # (scripts/wsb-cleanup.mjs); a Windows Sandbox still running afterwards is reported, not stopped. Counts only in the log; the reasons stay in the local folder.
      # Only test folders a run recorded (in the runner account's %LOCALAPPDATA%\NimbleNewt\wsb-records, which outlives the job) are acted on; others with the same name pattern are
      # counted and left alone (how to handle them by hand: docs/nimblenewt/own-hardware-runners.md). Reading the owners of the recorded folders' entries adds a few seconds per job.
      # 40 minutes: when `wsb list` does not answer, each list takes up to about 10 minutes through the scheduled-task launch (three calls, each its limit plus the helper's
      # margin and the task checks; two 30 s server probes, one 45 s context probe, one 60 s diagnostic call; windows-list.ts, windows-task-launch.ts), once per leftover whose
      # stop failed and once for the final check.
      - name: Release leftovers of the Sandbox runs
        id: cleanup
        if: always()
        continue-on-error: true
        timeout-minutes: 40
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/g05-local"
          node scripts/wsb-cleanup.mjs --local "$RUNNER_TEMP/g05-local" 2>&1 | tee "$RUNNER_TEMP/g05-local/cleanup.log" | node scripts/redact-log.mjs
      - name: Job summary and outcome
        if: always()
        shell: bash
        env:
          FS: ${{ steps.fs.outcome }}
          WSB: ${{ steps.wsb.outcome }}
          WD: ${{ steps.wd.outcome }}
          G05: ${{ steps.g05.outcome }}
          G06: ${{ steps.g06.outcome }}
          Y02: ${{ steps.y02.outcome }}
          CLEAN: ${{ steps.cleanup.outcome }}
        run: |
          {
            echo "## Windows evidence run (A03b, G05, G06, Y02)"
            echo "Evidence for the gates, not a sign-off. Judge it with containment-evidence.mjs gate and y02-checkpoint.mjs gate."
            echo
            echo "| Step | Outcome |"
            echo "|---|---|"
            echo "| G06 filesystem facts | $FS |"
            echo "| A03b real Windows Sandbox tests | $WSB |"
            echo "| G05 working-directory check (stand-in entry, packaged: false) | $WD |"
            echo "| G05 containment, redacted | $G05 |"
            echo "| G06 long paths | $G06 |"
            echo "| Y02 scenarios | $Y02 |"
            echo "| Leftovers of the Sandbox runs released | $CLEAN |"
            echo
            if [ -f "$RUNNER_TEMP/sandbox-windows/summary.json" ]; then echo "Sandbox tests: $(node -p "JSON.stringify(require(process.argv[1]).counts)" "$RUNNER_TEMP/sandbox-windows/summary.json" 2>/dev/null || echo unreadable)"; fi
            # The copied lines go through the same redaction as the step logs (scripts/redact-log.mjs).
            for f in "$RUNNER_TEMP/g05-local/workdir.log" "$RUNNER_TEMP/g05-local/g05.log" "$RUNNER_TEMP/g06-host/long-paths-counts.txt" "$RUNNER_TEMP/g05-local/cleanup.log"; do
              if [ -f "$f" ]; then echo; echo '```'; tail -n 15 "$f" | node scripts/redact-log.mjs; echo '```'; fi
            done
            # `|| true`: bash steps run with -e and pipefail, and a log with no scenario line (the run stopped early) must not end this step before the outcome check below.
            if [ -f "$RUNNER_TEMP/y02-wsb-local/y02.log" ]; then echo; echo '```'; grep -E "^[a-z0-9-]+: (pass|FAIL)|scenarios hold" "$RUNNER_TEMP/y02-wsb-local/y02.log" | tail -n 12 | node scripts/redact-log.mjs || true; echo '```'; fi
          } >> "$GITHUB_STEP_SUMMARY"
          for o in "$FS" "$WSB" "$WD" "$G05" "$G06" "$Y02" "$CLEAN"; do if [ "$o" != "success" ]; then echo "at least one step did not succeed (see the table in the job summary)"; exit 1; fi; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sandbox-windows
          path: ${{ runner.temp }}/sandbox-windows
          if-no-files-found: warn
          retention-days: 90
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: containment-windows-own-hardware
          path: ${{ runner.temp }}/g05-windows/containment-*.json
          if-no-files-found: warn
          retention-days: 90
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: g06-host-windows
          path: ${{ runner.temp }}/g06-host
          if-no-files-found: warn
          retention-days: 90
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: y02-scenarios-windows-own-hardware
          path: ${{ runner.temp }}/y02-windows/y02-scenarios-*.json
          if-no-files-found: warn
          retention-days: 90
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sandbox-windows-detail
          path: ${{ runner.temp }}/sandbox-windows-detail
          if-no-files-found: ignore
          retention-days: 7

  # Card A03b, the G05 owner bundle on the owner's own Windows PC (notes: "A03b owner bundle for the real-PC ten-case run"), so the ten cases run there with nothing for the owner to do:
  # only when the input g05_owner_bundle is ticked (default off), only from main of this repository (the same guards as the jobs above), and then ALONE (the probe and the Windows Sandbox job
  # are skipped). A GitHub-hosted job builds the bundle (the product launcher with its pinned toolchain, --locked, and its release record; node.exe checked against the official SHA-256;
  # scripts/g05-owner-bundle.mjs) and hands the SHA-256 of its SHA256SUMS over as a job output (a value the artifact cannot change). The own runner (run.cmd as the signed-in owner, not a
  # service and not elevated) checks the downloaded SHA256SUMS against that value and runs run-g05.ps1, which checks every file against SHA256SUMS, refuses to run elevated and writes only
  # redacted, personal-data-checked results. No checkout runs on the owner's machine: only the bundle. No secrets; nothing is installed.
  g05-bundle-build:
    name: G05 owner bundle (hosted build)
    if: ${{ inputs.g05_owner_bundle == true && github.repository == 'rkcth/NimbleNewt' && github.ref == 'refs/heads/main' }}
    runs-on: windows-latest
    timeout-minutes: 40
    outputs:
      sums_sha256: ${{ steps.bundle.outputs.sums_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.19.0"
      - run: npm ci
      - run: npm run build
      # The same product build as windows-appcontainer-experiment.yml (native/nn-launcher/RELEASE.md, step 1): the pinned toolchain, --locked, the path remap; then its release record and the record check.
      - name: Build the product launcher and its release record
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.1 --profile minimal 2>&1 | node scripts/redact-log.mjs
          out="$RUNNER_TEMP/launcher"; mkdir -p "$out"
          cd native/nn-launcher
          crate_w="$(cygpath -w "$PWD")"; cargo_w="$(cygpath -w "${CARGO_HOME:-$USERPROFILE/.cargo}")"
          RUSTFLAGS="--remap-path-prefix=$crate_w=/nn-launcher --remap-path-prefix=$cargo_w=/cargo -C link-arg=/Brepro" cargo build --release --locked 2>&1 | node ../../scripts/redact-log.mjs
          cp target/release/nn-launcher.exe "$out/nn-launcher.exe"
          node ../../scripts/native-launcher.mjs record --file "$out/nn-launcher.exe" --commit "$GITHUB_SHA" --out "$out/nn-launcher.record.json"
          node ../../scripts/native-launcher.mjs verify --file "$out/nn-launcher.exe" --record "$out/nn-launcher.record.json"
      - name: "Parse run-g05.ps1 (Windows PowerShell 5.1)"
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $f = (Resolve-Path 'experiments\windows-appcontainer\owner\run-g05.ps1').Path
          $errors = $null; $tokens = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($f, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Output "::error::run-g05.ps1: $($_.Message)" }; exit 1 }
      - name: Lay out the G05 owner bundle
        id: bundle
        shell: bash
        env:
          # The official SHA-256 of node v22.19.0 win-x64/node.exe (https://nodejs.org/dist/v22.19.0/SHASUMS256.txt, line "win-x64/node.exe").
          NODE_EXE_SHA256: "995a3fb3cefad590cd3f4b321532a4b9582fb9c6575320ed2e3e894caac3e362"
        run: |
          set -euo pipefail
          test "$(node -p process.version)" = "v22.19.0"
          b="$RUNNER_TEMP/g05-owner-bundle"; rm -rf "$b"
          node scripts/g05-owner-bundle.mjs make --out "$b" --launcher "$RUNNER_TEMP/launcher/nn-launcher.exe" --record "$RUNNER_TEMP/launcher/nn-launcher.record.json" --node "$(node -p process.execPath)" --node-sha256 "$NODE_EXE_SHA256" --commit "$GITHUB_SHA"
          sums="$(sha256sum -b < "$b/SHA256SUMS" | cut -d' ' -f1)"
          echo "sums_sha256=$sums" >> "$GITHUB_OUTPUT"
          { echo "## G05 owner bundle (own-hardware)"; echo "Commit \`$GITHUB_SHA\`; SHA-256 of its SHA256SUMS \`$sums\`."; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: g05-owner-bundle-own-hardware
          path: ${{ runner.temp }}/g05-owner-bundle
          if-no-files-found: error
          retention-days: 7

  g05-owner-run:
    name: G05 owner bundle on the Windows runner (signed-in, not elevated)
    needs: g05-bundle-build
    if: ${{ !cancelled() && inputs.g05_owner_bundle == true && github.repository == 'rkcth/NimbleNewt' && github.ref == 'refs/heads/main' && needs.g05-bundle-build.outputs.sums_sha256 != '' }}
    runs-on: [self-hosted, nimblenewt-windows]
    timeout-minutes: 45
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: g05-owner-bundle-own-hardware
          path: ${{ runner.temp }}/g05-owner-download
      # Nothing of the bundle runs before its SHA256SUMS matches the hosted job's output; run-g05.ps1 then checks every file against SHA256SUMS. The bundle is placed under this account's
      # LOCALAPPDATA (a long path), keeping its control folder from an earlier run so the backend can sweep that run's leftovers. Its output is redacted (the bundle's redact-log.mjs) before
      # it reaches the log; the zip it made (personal-data checked by run-g05.ps1) and the redacted log are uploaded.
      - name: Check the bundle, then run run-g05.ps1 as this runner's own account
        id: g05owner
        shell: powershell
        timeout-minutes: 40
        env:
          EXPECT_SUMS: ${{ needs.g05-bundle-build.outputs.sums_sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EXPECT_SUMS -cnotmatch '^[0-9a-f]{64}$') { Write-Output '::error::no SHA-256 of SHA256SUMS from the hosted job; nothing was run'; exit 1 }
          $src = Join-Path $env:RUNNER_TEMP 'g05-owner-download'
          $sha = [System.Security.Cryptography.SHA256]::Create()
          $got = (($sha.ComputeHash([System.IO.File]::ReadAllBytes((Join-Path $src 'SHA256SUMS'))) | ForEach-Object { $_.ToString('x2') }) -join '')
          if ($got -cne $env:EXPECT_SUMS) { Write-Output "::error::the downloaded SHA256SUMS has SHA-256 $got, the hosted job made $($env:EXPECT_SUMS); nothing was run"; exit 1 }
          $b = Join-Path $env:LOCALAPPDATA 'nn-g05-own-runner'
          if (Test-Path -LiteralPath $b) { Get-ChildItem -LiteralPath $b -Force | Where-Object { $_.Name -ne 'control' } | Remove-Item -Recurse -Force }
          New-Item -ItemType Directory -Path $b -Force | Out-Null
          Copy-Item -Path (Join-Path $src '*') -Destination $b -Recurse -Force
          $out = Join-Path $env:RUNNER_TEMP 'g05-owner-out'; New-Item -ItemType Directory -Path $out -Force | Out-Null
          $utf8 = New-Object System.Text.UTF8Encoding $false
          function Invoke-Piped([string] $exe, [string] $argText, [string] $inFile) {
            $psi = New-Object System.Diagnostics.ProcessStartInfo
            $psi.FileName = $exe; $psi.Arguments = $argText; $psi.UseShellExecute = $false; $psi.WorkingDirectory = $b
            $psi.RedirectStandardOutput = $true; $psi.RedirectStandardError = $true; $psi.StandardOutputEncoding = $utf8; $psi.StandardErrorEncoding = $utf8
            if ($inFile) { $psi.RedirectStandardInput = $true }
            $p = [System.Diagnostics.Process]::Start($psi)
            $o = $p.StandardOutput.ReadToEndAsync(); $e = $p.StandardError.ReadToEndAsync()
            if ($inFile) { $bytes = [System.IO.File]::ReadAllBytes($inFile); $p.StandardInput.BaseStream.Write($bytes, 0, $bytes.Length); $p.StandardInput.Close() }
            $p.WaitForExit()
            return @{ Code = $p.ExitCode; Text = ($o.Result + $e.Result) }
          }
          $ps = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $run = Invoke-Piped $ps ('-NoProfile -ExecutionPolicy Bypass -File "' + (Join-Path $b 'run-g05.ps1') + '"') $null
          $rawFile = Join-Path $env:RUNNER_TEMP 'g05-owner-raw.txt'
          [System.IO.File]::WriteAllText($rawFile, $run.Text, $utf8)
          $red = Invoke-Piped (Join-Path $b 'node\node.exe') ('"' + (Join-Path $b 'scripts\redact-log.mjs') + '"') $rawFile
          Remove-Item -LiteralPath $rawFile -Force
          [System.IO.File]::WriteAllText((Join-Path $out 'run-g05.redacted.txt'), $red.Text, $utf8)
          Write-Output $red.Text
          foreach ($d in @('Desktop', 'Downloads')) { $z = Join-Path (Join-Path $env:USERPROFILE $d) 'nn-g05-results.zip'; if ([System.IO.File]::Exists($z)) { Copy-Item -LiteralPath $z -Destination (Join-Path $out 'nn-g05-results.zip') -Force; break } }
          $tally = @($red.Text -split "`r?`n" | Where-Object { $_ -match 'cases hold|REFUSED|FAILED|finished' })
          [System.IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, "## G05 owner bundle on the own Windows runner (exit $($run.Code))`n``````text`n$($tally -join "`n")`n```````n", $utf8)
          exit $run.Code
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: g05-owner-results-own-hardware
          path: ${{ runner.temp }}/g05-owner-out
          if-no-files-found: warn
          retention-days: 90
