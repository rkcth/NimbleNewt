name: PostgreSQL versions

# Started by hand from the Actions tab (never by a push). On each operating system it runs the controller's PostgreSQL suites against the
# latest minor version of each PostgreSQL major from 14 to 18 (scripts/postgres-versions.mjs, card F04g). 17 and above are the supported
# versions and must pass; 14 to 16 are verified and reported, not supported. The server comes from an exact, locked `embedded-postgres`
# install per major (scripts/postgres-versions/<major>/package-lock.json), installed with install scripts disabled.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  versions:
    name: PostgreSQL ${{ matrix.major }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        major: ["14", "15", "16", "17", "18"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.19.0"
      - run: npm ci
      - run: npm run build
      - name: Run the PostgreSQL suites against this major version
        shell: bash
        env:
          PG_MAJOR: ${{ matrix.major }}
        run: node scripts/postgres-versions.mjs "$PG_MAJOR" "--out=$RUNNER_TEMP/pg-versions"
      - name: Show the summary
        if: always()
        shell: bash
        run: if [ -f "$RUNNER_TEMP/pg-versions/pg${{ matrix.major }}-summary.md" ]; then cat "$RUNNER_TEMP/pg-versions/pg${{ matrix.major }}-summary.md" >> "$GITHUB_STEP_SUMMARY"; else echo "No evidence was produced; see the job log." >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pg-versions-${{ matrix.os }}-${{ matrix.major }}
          path: ${{ runner.temp }}/pg-versions
          if-no-files-found: warn
          retention-days: 90
