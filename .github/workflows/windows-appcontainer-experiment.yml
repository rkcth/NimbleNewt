name: Windows AppContainer experiment

# An EXPERIMENT, not product code (experiments/windows-appcontainer/README.md; notes: "Windows AppContainer experiment" in docs/nimblenewt/implementation-plan/implementation-notes.md).
# It asks whether a low-privilege AppContainer (no network capability by default) inside a Job Object, with ACL grants for the container only, can confine an agent's tools on Windows
# without a virtual machine, without UAC at run time and without anyone signed in. Started by hand from the Actions tab only; it never runs on a push or a pull request.
#   job `hosted`:     a GitHub-hosted Windows machine (the runner account is an administrator and a session is open: the cheapest first answer).
#   job `own-runner`: the owner's self-hosted Windows runner, which runs as a service (no interactive session). It starts only when the input `own_runner` is ticked (default off)
#                     and only from main, so it is not run by accident. This is the run that answers the "no one signed in" and "no administrator" questions.
#                     It has no Rust toolchain and builds nothing: it runs the two launcher programs the hosted job built from this same commit (a short-lived artifact), after checking each
#                     against the SHA-256 the hosted job reported as a job output (a value the artifact cannot change). The programs on the owner's machine are those CI builds, never a local build.
# No secrets are used. The results (markdown and JSON, with names, paths and SIDs replaced) are uploaded as artifacts; job logs go through scripts/redact-log.mjs.
on:
  workflow_dispatch:
    inputs:
      own_runner:
        description: "Also run on the owner's own Windows runner (a service with no signed-in user). Leave off unless you mean it."
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  hosted:
    name: Hosted Windows
    runs-on: windows-latest
    timeout-minutes: 75
    # Set by the staging step only when both launcher programs exist and the product one matches its release record. Job outputs are read even when another step failed.
    outputs:
      launchers: ${{ steps.stage.outputs.launchers }}
      experiment_sha256: ${{ steps.stage.outputs.experiment_sha256 }}
      product_sha256: ${{ steps.stage.outputs.product_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.19.0"
      # Install scripts are disabled by .npmrc; the lockfile is authoritative. The build is needed only for the log redaction (scripts/redact-log.mjs).
      - run: npm ci
      - run: npm run build
      - name: Build the launcher (locked dependencies)
        id: build_experiment
        shell: bash
        working-directory: experiments/windows-appcontainer/launcher
        # The hash is taken as the build left the file, before any experiment step runs, and leaves as a step output (a later step cannot change it); the staging step requires its copy to match.
        # Hashed from standard input: GNU sha256sum puts a backslash before the hash when the file name has one (every Windows $RUNNER_TEMP path does).
        run: |
          cargo build --release --locked 2>&1 | node ../../../scripts/redact-log.mjs
          echo "sha256=$(sha256sum -b < target/release/nn-appc-launcher.exe | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      # Round 4 (see experiments/windows-appcontainer/README.md): one step per mode, each runs even when an earlier one failed, each has its own limit. The smoke ladder (round 2) and the
      # git ladder (round 3b: git does not need to run inside the container) have answered their questions and are no longer run here; their code stays in the repository.
      # Every probe cell has a 90 s hard limit (the probe ends itself after 60 s), every spawn step 15 s.
      - name: Child-program ladder (15 s per step)
        shell: bash
        timeout-minutes: 25
        run: |
          mkdir -p "$RUNNER_TEMP/appc-out"
          # The summary is written even when the harness ends non-zero; the step then keeps the harness's exit code (pipefail).
          rc=0
          node experiments/windows-appcontainer/run-experiment.mjs --out "$RUNNER_TEMP/appc-out" --mode spawn --timeout-ms 15000 2>&1 | node scripts/redact-log.mjs || rc=$?
          if [ -f "$RUNNER_TEMP/appc-out/spawn.md" ]; then cat "$RUNNER_TEMP/appc-out/spawn.md" >> "$GITHUB_STEP_SUMMARY"; fi
          exit "$rc"
      # Round 5 (README, notes "round 5"): the own hardware showed 0xC0000142 for every program that needs user32, as a service. Each step has an ATTEMPT and a RESULT line; results survive a hang.
      - name: Session 0 diagnostic, round 5 (15 s per step; window station, desktop, creation flag, program, folder grant)
        shell: bash
        if: always()
        timeout-minutes: 25
        run: |
          mkdir -p "$RUNNER_TEMP/appc-out"
          # The summary is written even when the harness ends non-zero; the step then keeps the harness's exit code (pipefail). With no summary (the harness was killed) the progress lines go to the summary.
          rc=0
          node experiments/windows-appcontainer/run-experiment.mjs --out "$RUNNER_TEMP/appc-out" --mode session0 --timeout-ms 15000 2>&1 | node scripts/redact-log.mjs || rc=$?
          if [ -f "$RUNNER_TEMP/appc-out/session0.md" ]; then cat "$RUNNER_TEMP/appc-out/session0.md" >> "$GITHUB_STEP_SUMMARY"; elif [ -f "$RUNNER_TEMP/appc-out/session0.progress" ]; then tail -n 80 "$RUNNER_TEMP/appc-out/session0.progress" | node scripts/redact-log.mjs >> "$GITHUB_STEP_SUMMARY"; fi
          exit "$rc"
      - name: Containment cases in fifteen configurations (90 s per cell)
        shell: bash
        if: always()
        timeout-minutes: 30
        run: |
          mkdir -p "$RUNNER_TEMP/appc-out"
          # The summary is written even when the harness ends non-zero; the step then keeps the harness's exit code (pipefail).
          rc=0
          node experiments/windows-appcontainer/run-experiment.mjs --out "$RUNNER_TEMP/appc-out" --mode cases --timeout-ms 90000 2>&1 | node scripts/redact-log.mjs || rc=$?
          if [ -f "$RUNNER_TEMP/appc-out/cases.md" ]; then cat "$RUNNER_TEMP/appc-out/cases.md" >> "$GITHUB_STEP_SUMMARY"; fi
          exit "$rc"
      - name: npm ci variants (45 s per step)
        shell: bash
        if: always()
        timeout-minutes: 15
        run: |
          mkdir -p "$RUNNER_TEMP/appc-out"
          # The summary is written even when the harness ends non-zero; the step then keeps the harness's exit code (pipefail).
          rc=0
          node experiments/windows-appcontainer/run-experiment.mjs --out "$RUNNER_TEMP/appc-out" --mode npm --timeout-ms 45000 2>&1 | node scripts/redact-log.mjs || rc=$?
          if [ -f "$RUNNER_TEMP/appc-out/npm.md" ]; then cat "$RUNNER_TEMP/appc-out/npm.md" >> "$GITHUB_STEP_SUMMARY"; fi
          exit "$rc"
      - name: Junction targets and ACL propagation
        shell: bash
        if: always()
        timeout-minutes: 5
        run: |
          mkdir -p "$RUNNER_TEMP/appc-out"
          # The summary is written even when the harness ends non-zero; the step then keeps the harness's exit code (pipefail).
          rc=0
          node experiments/windows-appcontainer/run-experiment.mjs --out "$RUNNER_TEMP/appc-out" --mode links --timeout-ms 90000 2>&1 | node scripts/redact-log.mjs || rc=$?
          if [ -f "$RUNNER_TEMP/appc-out/links.md" ]; then cat "$RUNNER_TEMP/appc-out/links.md" >> "$GITHUB_STEP_SUMMARY"; fi
          exit "$rc"
      - name: Timing (start-up, 100-file git commit, offline npm ci)
        shell: bash
        if: always()
        timeout-minutes: 15
        run: |
          mkdir -p "$RUNNER_TEMP/appc-out"
          # The summary is written even when the harness ends non-zero; the step then keeps the harness's exit code (pipefail).
          rc=0
          node experiments/windows-appcontainer/run-experiment.mjs --out "$RUNNER_TEMP/appc-out" --mode timing --timeout-ms 120000 2>&1 | node scripts/redact-log.mjs || rc=$?
          if [ -f "$RUNNER_TEMP/appc-out/timing.md" ]; then cat "$RUNNER_TEMP/appc-out/timing.md" >> "$GITHUB_STEP_SUMMARY"; fi
          exit "$rc"
      - name: Firewall mini-experiment (45 s per step)
        shell: bash
        if: always()
        timeout-minutes: 10
        run: |
          mkdir -p "$RUNNER_TEMP/appc-out"
          # The summary is written even when the harness ends non-zero; the step then keeps the harness's exit code (pipefail).
          rc=0
          node experiments/windows-appcontainer/run-experiment.mjs --out "$RUNNER_TEMP/appc-out" --mode firewall --timeout-ms 45000 2>&1 | node scripts/redact-log.mjs || rc=$?
          if [ -f "$RUNNER_TEMP/appc-out/firewall.md" ]; then cat "$RUNNER_TEMP/appc-out/firewall.md" >> "$GITHUB_STEP_SUMMARY"; fi
          exit "$rc"
      # Card A03b slice 3: the PRODUCT launcher (native/nn-launcher, no cargo feature) with the toolchain its rust-toolchain.toml pins, built `--locked`; `info` must work; an experiment-only command must be
      # refused ("not in this build"); the release record is made and verified. The experiment launcher above is the same source with the `experiment` feature. Unsigned: a hosted build is never a release.
      - name: "Product launcher (native/nn-launcher), locked build, info, refusal of experiment commands, release record"
        id: build_product
        shell: bash
        if: always()
        timeout-minutes: 20
        run: |
          rustup toolchain install 1.99.1 --profile minimal 2>&1 | node scripts/redact-log.mjs
          mkdir -p "$RUNNER_TEMP/appc-out"
          cd native/nn-launcher
          # rustc sees Windows paths (D:\a\...), not Git Bash's /d/a/...: the prefixes to remap are the Windows forms of the crate folder and the cargo home (RELEASE.md, step 1).
          crate_w="$(cygpath -w "$PWD")"; cargo_w="$(cygpath -w "${CARGO_HOME:-$USERPROFILE/.cargo}")"
          RUSTFLAGS="--remap-path-prefix=$crate_w=/nn-launcher --remap-path-prefix=$cargo_w=/cargo -C link-arg=/Brepro" cargo build --release --locked 2>&1 | node ../../scripts/redact-log.mjs
          # a report, not a gate (reproducibility is not claimed yet): does a build-machine folder name remain in the file?
          for p in "$crate_w" "$cargo_w" "$(cygpath -m "$PWD")"; do if grep -a -q -F -- "$p" target/release/nn-launcher.exe; then echo "::warning::the release file still names the build folder $p"; fi; done
          # the argument tests: the product build refuses every experiment-only option, the experiment build accepts them (src/args.rs)
          cargo test --locked 2>&1 | node ../../scripts/redact-log.mjs
          cargo test --locked --features experiment 2>&1 | node ../../scripts/redact-log.mjs
          # The product accepts only a per-run profile name (NimbleNewtRun- and 16 lower-case hex digits, a fresh one for every call) and a record file in an EXISTING folder that does not hold that file yet (create-new):
          # `info` makes a throw-away profile, asks the private window station question and deletes the profile again (native/nn-launcher/README.md, "info").
          info_name="NimbleNewtRun-$(node -e "process.stdout.write(require('crypto').randomBytes(8).toString('hex'))")"
          mkdir -p "$RUNNER_TEMP/profile-records"
          ./target/release/nn-launcher.exe info --name "$info_name" --profile-record "$(cygpath -w "$RUNNER_TEMP/profile-records/$info_name.sid")" > "$RUNNER_TEMP/product-info.json"
          node ../../scripts/redact-log.mjs < "$RUNNER_TEMP/product-info.json"
          grep -q '"ok":true' "$RUNNER_TEMP/product-info.json"
          # the private window station each run gets can be made and closed on this host (README "Window station")
          grep -q '"windowStation":"private"' "$RUNNER_TEMP/product-info.json"
          grep -q '"windowStationOk":true' "$RUNNER_TEMP/product-info.json"
          # the throw-away profile was deleted and is gone (profileGone is the not yet measured reading, README "One container profile per run"): a miss is reported after the later lines of this step ran, so the release record is still made
          profile_bad=0
          for k in profileDeleted profileGone; do if ! grep -q "\"$k\":true" "$RUNNER_TEMP/product-info.json"; then echo "::error::info did not report $k true"; profile_bad=1; fi; done
          rc=0; ./target/release/nn-launcher.exe dump --dump . > "$RUNNER_TEMP/product-refused.json" || rc=$?
          grep -q 'not in this build' "$RUNNER_TEMP/product-refused.json"
          test "$rc" -eq 125
          node ../../scripts/native-launcher.mjs record --file target/release/nn-launcher.exe --commit "$GITHUB_SHA" --out "$RUNNER_TEMP/appc-out/nn-launcher.record.json"
          node ../../scripts/native-launcher.mjs verify --file target/release/nn-launcher.exe --record "$RUNNER_TEMP/appc-out/nn-launcher.record.json"
          echo "sha256=$(sha256sum -b < target/release/nn-launcher.exe | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          exit "$profile_bad"
      # Card A03b reproducibility measurement: the same source, built a second time in a DIFFERENT folder (another path and another name, outside the first checkout) with its own target folder, the same pinned toolchain, the
      # same `--locked` and the same RUSTFLAGS (the path remap names the second folder, so the folder difference must not matter: that is what is measured). The two files are compared by SHA-256 and by scripts/pe-diff.mjs, which says WHERE
      # they differ when they do (header time stamp, debug directory and PDB path, code, constants, resources) and whether the file holds the commit, a build time or either build folder name. It is a REPORT, not a gate:
      # `set +e`, every failure inside becomes a ::warning:: and the step ends 0 (and `continue-on-error` is a second guard), because reproducibility is not claimed yet (RELEASE.md) and a difference must not hide the other results of this run.
      # It does not touch the first build's files (the stage step re-checks their hashes); the report and both files are uploaded with the other results.
      - name: "Product launcher reproducibility (second build from another folder; a report, not a gate)"
        id: repro_product
        shell: bash
        if: always()
        continue-on-error: true
        timeout-minutes: 25
        run: |
          set +e
          repo="$PWD"
          out="$RUNNER_TEMP/appc-out/repro"; mkdir -p "$out"
          first_dir="$repo/native/nn-launcher"
          first_exe="$first_dir/target/release/nn-launcher.exe"
          if [ ! -f "$first_exe" ]; then echo "::warning::reproducibility not measured: the first build left no file to compare"; exit 0; fi
          # a copy of the crate folder (every file the first build reads, byte for byte, without its target folder) under another path and another folder name, outside the checkout
          second_root="$RUNNER_TEMP/repro-second"; second_dir="$second_root/a-different-folder-name-for-the-second-build"
          rm -rf "$second_root"; mkdir -p "$second_dir"
          if ! ( cd "$first_dir" && tar -c --exclude=./target . ) | ( cd "$second_dir" && tar -x ); then echo "::warning::reproducibility not measured: the crate folder could not be copied"; exit 0; fi
          cd "$second_dir" || exit 0
          crate_w="$(cygpath -w "$first_dir")"; crate2_w="$(cygpath -w "$second_dir")"; cargo_w="$(cygpath -w "${CARGO_HOME:-$USERPROFILE/.cargo}")"
          echo "second build folder: ${#crate2_w} characters of path, first: ${#crate_w}; the folder names differ"
          # the same flags as the first build; only the crate folder named in the remap differs (it is the second folder, mapped to the same /nn-launcher)
          RUSTFLAGS="--remap-path-prefix=$crate2_w=/nn-launcher --remap-path-prefix=$cargo_w=/cargo -C link-arg=/Brepro" cargo build --release --locked 2>&1 | node "$repo/scripts/redact-log.mjs"
          second_exe="$second_dir/target/release/nn-launcher.exe"
          if [ ! -f "$second_exe" ]; then echo "::warning::reproducibility not measured: the second build did not produce a file"; exit 0; fi
          cp "$first_exe" "$out/nn-launcher.first.exe"; cp "$second_exe" "$out/nn-launcher.second.exe"
          cd "$repo" || exit 0
          rc=0
          node scripts/pe-diff.mjs "$out/nn-launcher.first.exe" "$out/nn-launcher.second.exe" --json "$out/nn-launcher.repro.json" --commit "$GITHUB_SHA" --needle "firstCrateFolder=$crate_w" --needle "secondCrateFolder=$crate2_w" --needle "cargoHome=$cargo_w" > "$out/nn-launcher.repro.txt" 2>&1 || rc=$?
          node scripts/redact-log.mjs < "$out/nn-launcher.repro.txt"
          { echo "## Product launcher reproducibility (two builds, two folders; hosted Windows)"; echo '```'; node scripts/redact-log.mjs < "$out/nn-launcher.repro.txt" | head -n 60; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -eq 0 ]; then echo "reproducibility result: identical (the two builds are byte for byte the same)"
          elif [ "$rc" -eq 1 ]; then echo "::warning::reproducibility result: DIFFERENT - see nn-launcher.repro.json and the why lines above; this is a report, not a gate"
          else echo "::warning::the comparison itself failed (exit $rc); see the output above"; fi
          exit 0
      # Card A03b, the home case (2026-11-25; README "The home case"): the owner's own PC has ONE account that runs as an administrator under UAC, not elevated, and there the product launcher cannot make its
      # named private window station (error 5) and fails closed. These runs measure the alternatives on the user's OWN window station (`home-probe`: a private desktop on WinSta0 with and without a temporary
      # entry for the container, and the desktop inherited) from three processes: (1) as this elevated runner, (2) as a DE-ELEVATED child of it (`deelevate`: Administrators deny-only, privileges removed,
      # medium integrity: what access checks see in a UAC-filtered token, built with CreateRestrictedToken; the UAC linked token itself is not used, so the result is for that token, not for every UAC state),
      # (3) the same de-elevated with the plain AppContainer. Cross-check: the PRODUCT launcher's `info` run de-elevated should reproduce the owner's measurement (the named window station refused,
      # error 5): if it does not, the de-elevation does not behave like the owner's token and (2) and (3) say nothing about it. A REPORT, not a gate (`continue-on-error`, `|| true`): a finding may be a
      # failure. Nothing is changed outside the run except one temporary entry for a throw-away container on WinSta0 when the desktop alone fails, removed in the same step.
      - name: "Home case: one account, not elevated (elevated and de-elevated runs of the same steps; a report, not a gate)"
        shell: bash
        if: always()
        continue-on-error: true
        timeout-minutes: 20
        run: |
          set +e
          exp="$PWD/experiments/windows-appcontainer/launcher/target/release/nn-appc-launcher.exe"
          prod="$PWD/native/nn-launcher/target/release/nn-launcher.exe"
          out="$RUNNER_TEMP/appc-out/home"; mkdir -p "$out"
          if [ ! -f "$exp" ]; then echo "::warning::the experiment launcher was not built; no home-case run"; exit 0; fi
          run_home() { # label, extra launcher arguments before home-probe, home-probe arguments
            label="$1"; shift; pre="$1"; shift
            # shellcheck disable=SC2086
            "$exp" $pre home-probe --timeout-ms 20000 "$@" > "$out/home-$label.jsonl" 2> "$out/home-$label.log"
            echo "home-probe $label exited $?"
            node experiments/windows-appcontainer/home.mjs summarize "$out/home-$label.jsonl" --label "$label" | tee "$out/home-$label.md" >> "$GITHUB_STEP_SUMMARY"
            node scripts/redact-log.mjs < "$out/home-$label.log" | tail -40
          }
          run_home elevated-lpac "" --aap-policy optout
          run_home deelevated-lpac deelevate --aap-policy optout
          run_home deelevated-plain deelevate --aap-policy none
          # the cross-check: the product launcher's info, de-elevated
          if [ -f "$prod" ]; then
            hex16="$(node -e "process.stdout.write(require('crypto').randomBytes(8).toString('hex'))")"; home_name="NimbleNewtRun-$hex16"
            mkdir -p "$RUNNER_TEMP/home-records"
            "$exp" deelevate --exe "$(cygpath -w "$prod")" info --name "$home_name" --profile-record "$(cygpath -w "$RUNNER_TEMP/home-records/$home_name.sid")" > "$out/product-info-deelevated.txt" 2>&1
            node scripts/redact-log.mjs < "$out/product-info-deelevated.txt"
            { echo "### Cross-check: the product launcher's info, de-elevated"; echo; echo '```'; grep -o '"windowStationOk":[a-z]*\|"windowStationError":"[^"]*"\|"elevated":[a-z]*\|"profileGone":[a-z]*' "$out/product-info-deelevated.txt" | sort -u; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0
      # Card A03b slice 3: the administrator installer script is parsed by PowerShell and run with -WhatIf and Verify. Neither changes the machine: the checks below fail the step if an account or a folder appeared.
      # The owner's first real run (Windows PowerShell 5.1, elevated, `-File`, a relative -LauncherPath, the default account name) failed in the hash step. This step now runs EXACTLY that command (the product
      # nn-launcher.exe built above, its sha256, `powershell.exe -ExecutionPolicy Bypass -File ... -Action Install -LauncherPath .\nn-launcher.exe -ExpectedSha256 <hash> -AllowUnsigned -WhatIf`) under Windows
      # PowerShell 5.1 AND under PowerShell 7 (pwsh), and fails on any error text, a missing dry-run line, a non-zero exit, or anything the dry run changed.
      - name: "Installer script (parse, -WhatIf and Verify; changes nothing)"
        id: installer_whatif
        shell: powershell
        if: always()
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
          $f = (Resolve-Path 'native\install\Install-NimbleNewtLauncher.ps1').Path
          $errors = $null; $tokens = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($f, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Output "::error::$($_.Message)" }; exit 1 }
          $tmp = Join-Path $env:RUNNER_TEMP 'nn-whatif'; New-Item -ItemType Directory -Path $tmp -Force | Out-Null
          Copy-Item 'native\nn-launcher\target\release\nn-launcher.exe' (Join-Path $tmp 'nn-launcher.exe')
          # the hash with .NET alone, not with the installer's own helper, so a fault in the helper cannot hide itself
          $sha = [System.Security.Cryptography.SHA256]::Create()
          $bytes = $sha.ComputeHash([System.IO.File]::ReadAllBytes((Join-Path $tmp 'nn-launcher.exe')))
          $h = (($bytes | ForEach-Object { $_.ToString('x2') }) -join '')
          if ($h.Length -ne 64) { Write-Output '::error::the hash was not computed'; exit 1 }
          $account = 'nimblenewt-worker'
          function Assert-Untouched([string] $when) {
            if (Get-LocalUser -Name $account -ErrorAction SilentlyContinue) { Write-Output "::error::$when : the account $account exists"; exit 1 }
            if (Test-Path (Join-Path $env:ProgramFiles 'NimbleNewt')) { Write-Output "::error::$when : the install folder exists"; exit 1 }
            if (Test-Path (Join-Path $env:ProgramData 'NimbleNewt')) { Write-Output "::error::$when : the data folder exists"; exit 1 }
          }
          Assert-Untouched 'before the dry run'
          # One dry run: the child shell runs the script with -File (as the owner did); its output (host lines and errors) goes to a file, then the checks read it.
          function Invoke-DryRun([string] $label, [string] $shellExe, [string[]] $shellArgs, [string[]] $scriptArgs) {
            $outFile = Join-Path $tmp "$label.txt"
            $old = $ErrorActionPreference; $ErrorActionPreference = 'Continue'
            Push-Location $tmp
            try { & $shellExe @shellArgs -File $f @scriptArgs *> $outFile; $code = $LASTEXITCODE } finally { Pop-Location; $ErrorActionPreference = $old }
            $text = (Get-Content -LiteralPath $outFile -Raw) | Out-String
            Write-Output "---- $label (exit $code) ----"; Write-Output $text
            return @{ Code = $code; Text = $text }
          }
          # Dry-run lines that must appear: what -WhatIf says it WOULD do, and the unsigned warning. Error text that must not.
          $mustSay = @('What if: Performing the operation "create a local standard user', 'What if: Performing the operation "grant SeBatchLogonRight', 'create (if absent) and set a protected access list', 'place nn-launcher.exe', 'write the four NIMBLENEWT_WIN_', 'WARNING: installing an UNSIGNED launcher', 'Install finished')
          $mustNot = @('PropertyNotFound', 'cannot be found on this object', 'Retrieve the value for property', 'Exception', 'Nothing was changed', 'FullyQualifiedErrorId')
          function Assert-Dry($r, [string] $label) {
            if ($r.Code -ne 0) { Write-Output "::error::$label : exit $($r.Code)"; exit 1 }
            foreach ($m in $mustSay) { if ($r.Text.IndexOf($m, [System.StringComparison]::Ordinal) -lt 0) { Write-Output "::error::$label : the dry-run line is missing: $m"; exit 1 } }
            foreach ($m in $mustNot) { if ($r.Text.IndexOf($m, [System.StringComparison]::Ordinal) -ge 0) { Write-Output "::error::$label : unexpected text: $m"; exit 1 } }
            Assert-Untouched $label
          }
          $common = @('-Action', 'Install', '-ExpectedSha256', $h, '-AllowUnsigned', '-WhatIf')
          # Windows PowerShell 5.1, with a RELATIVE launcher path from its own folder: the owner's command
          $r51 = Invoke-DryRun 'install-whatif-ps51' 'powershell.exe' @('-NoProfile', '-ExecutionPolicy', 'Bypass') ($common + @('-LauncherPath', '.\nn-launcher.exe'))
          Assert-Dry $r51 'Install -WhatIf, Windows PowerShell 5.1'
          # PowerShell 7, with the full path
          $r7 = Invoke-DryRun 'install-whatif-pwsh' 'pwsh' @('-NoProfile', '-ExecutionPolicy', 'Bypass') ($common + @('-LauncherPath', (Join-Path $tmp 'nn-launcher.exe')))
          Assert-Dry $r7 'Install -WhatIf, PowerShell 7'
          # Verify on a machine with nothing installed must run to its end and report failures (exit 1), never crash; also with -WhatIf (a read must not be silenced by it).
