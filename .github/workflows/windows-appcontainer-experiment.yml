name: Windows AppContainer experiment

# An EXPERIMENT, not product code (experiments/windows-appcontainer/README.md; notes: "Windows AppContainer experiment" in docs/nimblenewt/implementation-plan/implementation-notes.md).
# It asks whether a low-privilege AppContainer (no network capability by default) inside a Job Object, with ACL grants for the container only, can confine an agent's tools on Windows
# without a virtual machine, without UAC at run time and without anyone signed in. Started by hand from the Actions tab only; it never runs on a push or a pull request.
#   job `hosted`:     a GitHub-hosted Windows machine (the runner account is an administrator and a session is open: the cheapest first answer).
#   job `own-runner`: the owner's self-hosted Windows runner, which runs as a service (no interactive session). It starts only when the input `own_runner` is ticked (default off)
#                     and only from main, so it is not run by accident. This is the run that answers the "no one signed in" and "no administrator" questions.
#                     It has no Rust toolchain and builds nothing: it runs the two launcher programs the hosted job built from this same commit (a short-lived artifact), after checking each
#                     against the SHA-256 the hosted job reported as a job output (a value the artifact cannot change). The programs on the owner's machine are those CI builds, never a local build.
# No secrets are used. The results (markdown and JSON, with names, paths and SIDs replaced) are uploaded as artifacts; job logs go through scripts/redact-log.mjs.
on:
  workflow_dispatch:
    inputs:
      own_runner:
        description: "Also run on the owner's own Windows runner (a service with no signed-in user). Leave off unless you mean it."
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  hosted:
    name: Hosted Windows
    runs-on: windows-latest
    timeout-minutes: 75
    # Set by the staging step only when both launcher programs exist and the product one matches its release record. Job outputs are read even when another step failed.
    outputs:
      launchers: ${{ steps.stage.outputs.launchers }}
      experiment_sha256: ${{ steps.stage.outputs.experiment_sha256 }}
      product_sha256: ${{ steps.stage.outputs.product_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.19.0"
      # Install scripts are disabled by .npmrc; the lockfile is authoritative. The build is needed only for the log redaction (scripts/redact-log.mjs).
      - run: npm ci
      - run: npm run build
      - name: Build the launcher (locked dependencies)
        id: build_experiment
        shell: bash
        working-directory: experiments/windows-appcontainer/launcher
        # The hash is taken as the build left the file, before any experiment step runs, and leaves as a step output (a later step cannot change it); the staging step requires its copy to match.
        # Hashed from standard input: GNU sha256sum puts a backslash before the hash when the file name has one (every Windows $RUNNER_TEMP path does).
        run: |
          cargo build --release --locked 2>&1 | node ../../../scripts/redact-log.mjs
          echo "sha256=$(sha256sum -b < target/release/nn-appc-launcher.exe | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      # Round 4 (see experiments/windows-appcontainer/README.md): one step per mode, each runs even when an earlier one failed, each has its own limit. The smoke ladder (round 2) and the
      # git ladder (round 3b: git does not need to run inside the container) have answered their questions and are no longer run here; their code stays in the repository.
      # Every probe cell has a 90 s hard limit (the probe ends itself after 60 s), every spawn step 15 s.
      - name: Child-program ladder (15 s per step)
        shell: bash
        timeout-minutes: 25
        run: |
          mkdir -p "$RUNNER_TEMP/appc-out"
          # The summary is written even when the harness ends non-zero; the step then keeps the harness's exit code (pipefail).
          rc=0
          node experiments/windows-appcontainer/run-experiment.mjs --out "$RUNNER_TEMP/appc-out" --mode spawn --timeout-ms 15000 2>&1 | node scripts/redact-log.mjs || rc=$?
          if [ -f "$RUNNER_TEMP/appc-out/spawn.md" ]; then cat "$RUNNER_TEMP/appc-out/spawn.md" >> "$GITHUB_STEP_SUMMARY"; fi
          exit "$rc"
      # Round 5 (README, notes "round 5"): the own hardware showed 0xC0000142 for every program that needs user32, as a service. Each step has an ATTEMPT and a RESULT line; results survive a hang.
      - name: Session 0 diagnostic, round 5 (15 s per step; window station, desktop, creation flag, program, folder grant)
        shell: bash
        if: always()
        timeout-minutes: 25
        run: |
          mkdir -p "$RUNNER_TEMP/appc-out"
          # The summary is written even when the harness ends non-zero; the step then keeps the harness's exit code (pipefail). With no summary (the harness was killed) the progress lines go to the summary.
          rc=0
          node experiments/windows-appcontainer/run-experiment.mjs --out "$RUNNER_TEMP/appc-out" --mode session0 --timeout-ms 15000 2>&1 | node scripts/redact-log.mjs || rc=$?
          if [ -f "$RUNNER_TEMP/appc-out/session0.md" ]; then cat "$RUNNER_TEMP/appc-out/session0.md" >> "$GITHUB_STEP_SUMMARY"; elif [ -f "$RUNNER_TEMP/appc-out/session0.progress" ]; then tail -n 80 "$RUNNER_TEMP/appc-out/session0.progress" | node scripts/redact-log.mjs >> "$GITHUB_STEP_SUMMARY"; fi
          exit "$rc"
      - name: Containment cases in fifteen configurations (90 s per cell)
        shell: bash
        if: always()
        timeout-minutes: 30
        run: |
          mkdir -p "$RUNNER_TEMP/appc-out"
          # The summary is written even when the harness ends non-zero; the step then keeps the harness's exit code (pipefail).
          rc=0
          node experiments/windows-appcontainer/run-experiment.mjs --out "$RUNNER_TEMP/appc-out" --mode cases --timeout-ms 90000 2>&1 | node scripts/redact-log.mjs || rc=$?
          if [ -f "$RUNNER_TEMP/appc-out/cases.md" ]; then cat "$RUNNER_TEMP/appc-out/cases.md" >> "$GITHUB_STEP_SUMMARY"; fi
          exit "$rc"
      - name: npm ci variants (45 s per step)
        shell: bash
        if: always()
        timeout-minutes: 15
        run: |
          mkdir -p "$RUNNER_TEMP/appc-out"
          # The summary is written even when the harness ends non-zero; the step then keeps the harness's exit code (pipefail).
          rc=0
          node experiments/windows-appcontainer/run-experiment.mjs --out "$RUNNER_TEMP/appc-out" --mode npm --timeout-ms 45000 2>&1 | node scripts/redact-log.mjs || rc=$?
          if [ -f "$RUNNER_TEMP/appc-out/npm.md" ]; then cat "$RUNNER_TEMP/appc-out/npm.md" >> "$GITHUB_STEP_SUMMARY"; fi
          exit "$rc"
      - name: Junction targets and ACL propagation
        shell: bash
        if: always()
        timeout-minutes: 5
        run: |
          mkdir -p "$RUNNER_TEMP/appc-out"
          # The summary is written even when the harness ends non-zero; the step then keeps the harness's exit code (pipefail).
          rc=0
          node experiments/windows-appcontainer/run-experiment.mjs --out "$RUNNER_TEMP/appc-out" --mode links --timeout-ms 90000 2>&1 | node scripts/redact-log.mjs || rc=$?
          if [ -f "$RUNNER_TEMP/appc-out/links.md" ]; then cat "$RUNNER_TEMP/appc-out/links.md" >> "$GITHUB_STEP_SUMMARY"; fi
          exit "$rc"
      - name: Timing (start-up, 100-file git commit, offline npm ci)
        shell: bash
        if: always()
        timeout-minutes: 15
        run: |
          mkdir -p "$RUNNER_TEMP/appc-out"
          # The summary is written even when the harness ends non-zero; the step then keeps the harness's exit code (pipefail).
          rc=0
          node experiments/windows-appcontainer/run-experiment.mjs --out "$RUNNER_TEMP/appc-out" --mode timing --timeout-ms 120000 2>&1 | node scripts/redact-log.mjs || rc=$?
          if [ -f "$RUNNER_TEMP/appc-out/timing.md" ]; then cat "$RUNNER_TEMP/appc-out/timing.md" >> "$GITHUB_STEP_SUMMARY"; fi
          exit "$rc"
      - name: Firewall mini-experiment (45 s per step)
        shell: bash
        if: always()
        timeout-minutes: 10
        run: |
          mkdir -p "$RUNNER_TEMP/appc-out"
          # The summary is written even when the harness ends non-zero; the step then keeps the harness's exit code (pipefail).
          rc=0
          node experiments/windows-appcontainer/run-experiment.mjs --out "$RUNNER_TEMP/appc-out" --mode firewall --timeout-ms 45000 2>&1 | node scripts/redact-log.mjs || rc=$?
          if [ -f "$RUNNER_TEMP/appc-out/firewall.md" ]; then cat "$RUNNER_TEMP/appc-out/firewall.md" >> "$GITHUB_STEP_SUMMARY"; fi
          exit "$rc"
      # Card A03b slice 3: the PRODUCT launcher (native/nn-launcher, no cargo feature) with the toolchain its rust-toolchain.toml pins, built `--locked`; `info` must work; an experiment-only command must be
      # refused ("not in this build"); the release record is made and verified. The experiment launcher above is the same source with the `experiment` feature. Unsigned: a hosted build is never a release.
      - name: "Product launcher (native/nn-launcher), locked build, info, refusal of experiment commands, release record"
        id: build_product
        shell: bash
        if: always()
        timeout-minutes: 20
        run: |
          rustup toolchain install 1.99.1 --profile minimal 2>&1 | node scripts/redact-log.mjs
          mkdir -p "$RUNNER_TEMP/appc-out"
          cd native/nn-launcher
          # rustc sees Windows paths (D:\a\...), not Git Bash's /d/a/...: the prefixes to remap are the Windows forms of the crate folder and the cargo home (RELEASE.md, step 1).
          crate_w="$(cygpath -w "$PWD")"; cargo_w="$(cygpath -w "${CARGO_HOME:-$USERPROFILE/.cargo}")"
          RUSTFLAGS="--remap-path-prefix=$crate_w=/nn-launcher --remap-path-prefix=$cargo_w=/cargo -C link-arg=/Brepro" cargo build --release --locked 2>&1 | node ../../scripts/redact-log.mjs
          # a report, not a gate (reproducibility is not claimed yet): does a build-machine folder name remain in the file?
          for p in "$crate_w" "$cargo_w" "$(cygpath -m "$PWD")"; do if grep -a -q -F -- "$p" target/release/nn-launcher.exe; then echo "::warning::the release file still names the build folder $p"; fi; done
          # the argument tests: the product build refuses every experiment-only option, the experiment build accepts them (src/args.rs)
          cargo test --locked 2>&1 | node ../../scripts/redact-log.mjs
          cargo test --locked --features experiment 2>&1 | node ../../scripts/redact-log.mjs
          ./target/release/nn-launcher.exe info --name NimbleNewtProductCheck > "$RUNNER_TEMP/product-info.json"
          node ../../scripts/redact-log.mjs < "$RUNNER_TEMP/product-info.json"
          grep -q '"ok":true' "$RUNNER_TEMP/product-info.json"
          rc=0; ./target/release/nn-launcher.exe dump --dump . > "$RUNNER_TEMP/product-refused.json" || rc=$?
          grep -q 'not in this build' "$RUNNER_TEMP/product-refused.json"
          test "$rc" -eq 125
          node ../../scripts/native-launcher.mjs record --file target/release/nn-launcher.exe --commit "$GITHUB_SHA" --out "$RUNNER_TEMP/appc-out/nn-launcher.record.json"
          node ../../scripts/native-launcher.mjs verify --file target/release/nn-launcher.exe --record "$RUNNER_TEMP/appc-out/nn-launcher.record.json"
          echo "sha256=$(sha256sum -b < target/release/nn-launcher.exe | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      # Card A03b slice 3: the administrator installer script is parsed by PowerShell and run with -WhatIf and Verify. Neither changes the machine: the checks below fail the step if an account or a folder appeared.
      - name: "Installer script (parse, -WhatIf and Verify; changes nothing)"
        shell: powershell
        if: always()
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Stop'
          $f = (Resolve-Path 'native\install\Install-NimbleNewtLauncher.ps1').Path
          $errors = $null; $tokens = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($f, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Output "::error::$($_.Message)" }; exit 1 }
          $tmp = Join-Path $env:RUNNER_TEMP 'nn-whatif'; New-Item -ItemType Directory -Path $tmp -Force | Out-Null
          Copy-Item 'native\nn-launcher\target\release\nn-launcher.exe' (Join-Path $tmp 'nn-launcher.exe')
          $h = (Get-FileHash (Join-Path $tmp 'nn-launcher.exe') -Algorithm SHA256).Hash
          & $f -Action Install -LauncherPath (Join-Path $tmp 'nn-launcher.exe') -ExpectedSha256 $h -AllowUnsigned -AccountName nn-whatif-check -WhatIf
          if ($LASTEXITCODE -ne 0 -and $null -ne $LASTEXITCODE) { Write-Output "::error::-WhatIf install ended with $LASTEXITCODE"; exit 1 }
          if (Get-LocalUser -Name nn-whatif-check -ErrorAction SilentlyContinue) { Write-Output '::error::-WhatIf made the account'; exit 1 }
          if (Test-Path (Join-Path $env:ProgramFiles 'NimbleNewt')) { Write-Output '::error::-WhatIf made the install folder'; exit 1 }
          if (Test-Path (Join-Path $env:ProgramData 'NimbleNewt')) { Write-Output '::error::-WhatIf made the data folder'; exit 1 }
          # Verify on a machine with nothing installed must run to its end and report failures (exit 1), never crash.
          # *>&1: the script prints with Write-Host, which is the information stream (6) in Windows PowerShell 5.1; 2>&1 alone would capture nothing.
          $out = & $f -Action Verify *>&1 | Out-String
          Write-Output $out
          if ($out -notmatch 'FAIL  the account exists' -or $out -notmatch 'RESULT:') { Write-Output '::error::Verify did not report on an empty machine'; exit 1 }
          exit 0
      # Card A03b slice 2: the ten containment cases of card G05 through the PRODUCT backend (windowsNativeBackend, the launcher built above), run by the node case runner inside the container.
      # The report is redacted (names, paths and SIDs replaced) and uploaded with the rest. Nothing here is a release gate: a hosted run does not prove the service-account, non-administrator or Home items.
      - name: G05 containment cases through the native backend (one confined start, node runner)
        shell: bash
        if: always()
        timeout-minutes: 20
        env:
          NIMBLENEWT_WIN_LAUNCHER: ${{ github.workspace }}\native\nn-launcher\target\release\nn-launcher.exe
          NIMBLENEWT_WIN_CONTROL_DIR: ${{ runner.temp }}\nn-native
        run: |
          mkdir -p "$RUNNER_TEMP/appc-out/g05-native"
          rc=0
          node --import ./scripts/offline-guard.mjs scripts/containment-evidence.mjs run --out "$RUNNER_TEMP/appc-out/g05-native" --redact 2>&1 | node scripts/redact-log.mjs | tee "$RUNNER_TEMP/g05-native.log" || rc=$?
          { echo "## G05 containment cases, native backend (hosted Windows)"; echo '```'; tail -n 20 "$RUNNER_TEMP/g05-native.log" 2>/dev/null || echo "no output"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      # The programs the own-runner job runs (that machine has no Rust). Staged here, hashed here, kept 7 days. The hashes also leave as job outputs, so the other job checks the downloaded files against a value
      # that did not travel inside the artifact. Runs after every build step whatever happened to the experiment steps; `launchers` stays empty (the own-runner job then does not start) unless both files exist
      # and the product file matches its release record, and both staged copies still have the hashes their build steps reported right after building (so an experiment step in between cannot
      # have changed them).
      - name: Stage the built launchers for the own-runner job
        id: stage
        shell: bash
        if: always()
        env:
          BUILT_EXPERIMENT: ${{ steps.build_experiment.outputs.sha256 }}
          BUILT_PRODUCT: ${{ steps.build_product.outputs.sha256 }}
        run: |
          d="$RUNNER_TEMP/launchers"; rm -rf "$d"; mkdir -p "$d"
          exp=experiments/windows-appcontainer/launcher/target/release/nn-appc-launcher.exe
          prod=native/nn-launcher/target/release/nn-launcher.exe
          rec="$RUNNER_TEMP/appc-out/nn-launcher.record.json"
          # from standard input: with a file name containing a backslash (any $RUNNER_TEMP path here) GNU sha256sum writes "\<hash>"
          hash() { sha256sum -b < "$1" | cut -d' ' -f1; }
          hex64() { [ "${#1}" -eq 64 ] && case "$1" in *[!0-9a-f]*) false;; esac; }
          if [ -f "$exp" ] && [ -f "$prod" ] && [ -f "$rec" ] && hex64 "$BUILT_EXPERIMENT" && hex64 "$BUILT_PRODUCT" && node scripts/native-launcher.mjs verify --file "$prod" --record "$rec"; then
            cp "$exp" "$d/nn-appc-launcher.exe"; cp "$prod" "$d/nn-launcher.exe"; cp "$rec" "$d/nn-launcher.record.json"
            e="$(hash "$d/nn-appc-launcher.exe")"; p="$(hash "$d/nn-launcher.exe")"
            if [ "$e" = "$BUILT_EXPERIMENT" ] && [ "$p" = "$BUILT_PRODUCT" ]; then
              printf '%s  nn-appc-launcher.exe\n%s  nn-launcher.exe\n' "$e" "$p" > "$d/SHA256SUMS"
              { echo "launchers=ok"; echo "experiment_sha256=$e"; echo "product_sha256=$p"; } >> "$GITHUB_OUTPUT"
              echo "::notice::staged launchers for commit $GITHUB_SHA (experiment $e, product $p)"
            else
              echo "::warning::a launcher changed after its build step (staged experiment $e, built $BUILT_EXPERIMENT; staged product $p, built $BUILT_PRODUCT); nothing was staged, the own-runner job will not start"
            fi
          else
            echo "::warning::the launchers were not staged (a build or the release record check failed); the own-runner job will not start"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() && steps.stage.outputs.launchers == 'ok' }}
        with:
          name: windows-appcontainer-launchers
          path: ${{ runner.temp }}/launchers
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-appcontainer-hosted
          path: ${{ runner.temp }}/appc-out
          if-no-files-found: warn
          retention-days: 90

  own-runner:
    name: Own Windows runner (service)
    needs: hosted
    # `!cancelled()` (not the default "every needed job succeeded"): an experiment step of the hosted job that fails (a finding is allowed to be a failure) must not stop this run, but a hosted job that
    # built no launcher must: `launchers == 'ok'` is set only when both programs were staged with a matching release record. Unticked, other repository or other branch: skipped as before.
    if: ${{ !cancelled() && needs.hosted.outputs.launchers == 'ok' && inputs.own_runner == true && github.repository == 'rkcth/NimbleNewt' && github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, nimblenewt-windows]
    timeout-minutes: 45
    concurrency:
      group: windows-appcontainer-own-runner
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Same Git Bash step as own-hardware.yml (a plain `shell: bash` can resolve to the WSL launcher on this runner).
      - name: Use Git Bash for bash steps
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @()
          $git = Get-Command git.exe -CommandType Application -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($git) { $root = Split-Path (Split-Path $git.Source -Parent) -Parent; foreach ($r in @($root, (Split-Path $root -Parent))) { if ($r) { $candidates += Join-Path $r 'bin' } } }
          $candidates += Join-Path $env:ProgramFiles 'Git\bin'
          $dir = $candidates | Where-Object { Test-Path -LiteralPath (Join-Path $_ 'bash.exe') } | Select-Object -First 1
          if (-not $dir) { Write-Output "::error::Git Bash (Git for Windows bin\bash.exe) was not found; install Git for Windows (docs/nimblenewt/own-hardware-runners.md)"; exit 1 }
          & (Join-Path $dir 'bash.exe') --noprofile --norc -c 'echo bash for this job: $BASH $BASH_VERSION'
          if ($LASTEXITCODE -ne 0) { exit 1 }
          [System.IO.File]::AppendAllText($env:GITHUB_PATH, "$dir`n", (New-Object System.Text.UTF8Encoding $false))
      - run: npm ci
      - run: npm run build
      # No Rust here. The launchers are the ones the hosted job built from this commit. Nothing below starts either program until the check has passed; the programs are placed (for the harness's default
      # path and for the product backend) only after their hashes match the hosted job's outputs, and the placed copies are hashed again.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-appcontainer-launchers
          path: ${{ runner.temp }}/downloaded-launchers
      # Every later step that starts a launcher runs only when this step succeeded (`steps.verify.outcome == 'success'`, never a bare always()).
      - name: Verify the downloaded launchers against the hosted job's hashes, then place them
        id: verify
        shell: bash
        env:
          EXPECT_EXPERIMENT: ${{ needs.hosted.outputs.experiment_sha256 }}
          EXPECT_PRODUCT: ${{ needs.hosted.outputs.product_sha256 }}
        run: |
          set -eu
          case "$EXPECT_EXPERIMENT" in *[!0-9a-f]*|"") echo "::error::no hash for the experiment launcher from the hosted job"; exit 1;; esac
          case "$EXPECT_PRODUCT" in *[!0-9a-f]*|"") echo "::error::no hash for the product launcher from the hosted job"; exit 1;; esac
          [ "${#EXPECT_EXPERIMENT}" -eq 64 ] && [ "${#EXPECT_PRODUCT}" -eq 64 ] || { echo "::error::a hash from the hosted job is not 64 hex digits"; exit 1; }
          src="$RUNNER_TEMP/downloaded-launchers"; ok="$RUNNER_TEMP/verified-launchers"; dest=experiments/windows-appcontainer/launcher/target/release
          rm -rf "$ok"
          # from standard input: with a file name containing a backslash (any $RUNNER_TEMP path here) GNU sha256sum writes "\<hash>"
          check() { got="$(sha256sum -b < "$1" | cut -d' ' -f1)"; if [ "$got" != "$2" ]; then echo "::error::$1 has SHA-256 $got, the hosted job built $2; nothing was run"; exit 1; fi; }
          check "$src/nn-appc-launcher.exe" "$EXPECT_EXPERIMENT"
          check "$src/nn-launcher.exe" "$EXPECT_PRODUCT"
          node scripts/native-launcher.mjs verify --file "$src/nn-launcher.exe" --record "$src/nn-launcher.record.json"
          mkdir -p "$ok" "$dest"
          cp "$src/nn-launcher.exe" "$ok/nn-launcher.exe"; cp "$src/nn-launcher.record.json" "$ok/nn-launcher.record.json"; cp "$src/nn-appc-launcher.exe" "$dest/nn-appc-launcher.exe"
          check "$ok/nn-launcher.exe" "$EXPECT_PRODUCT"; check "$dest/nn-appc-launcher.exe" "$EXPECT_EXPERIMENT"
          echo "launchers verified: experiment $EXPECT_EXPERIMENT, product $EXPECT_PRODUCT (built by CI from $GITHUB_SHA)"
          { echo "## Launchers on this machine"; echo "Built by the hosted job from commit \`$GITHUB_SHA\` and verified before use: experiment \`$EXPECT_EXPERIMENT\`, product \`$EXPECT_PRODUCT\`. Unsigned; nothing was built here."; } >> "$GITHUB_STEP_SUMMARY"
      - name: Containment cases as the runner service (no window, no prompt)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/appc-out"
          # The summary is written even when the harness ends non-zero; the step then keeps the harness's exit code (pipefail).
          rc=0
          node experiments/windows-appcontainer/run-experiment.mjs --out "$RUNNER_TEMP/appc-out" --mode cases --timeout-ms 90000 2>&1 | node scripts/redact-log.mjs || rc=$?
          if [ -f "$RUNNER_TEMP/appc-out/cases.md" ]; then cat "$RUNNER_TEMP/appc-out/cases.md" >> "$GITHUB_STEP_SUMMARY"; fi
          exit "$rc"
      # Round 5: the run that answers why the container's programs end with 0xC0000142 as a service; gated on the verify step like every step that starts a launcher.
      - name: Session 0 diagnostic, round 5, as the runner service
        shell: bash
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        timeout-minutes: 25
        run: |
          mkdir -p "$RUNNER_TEMP/appc-out"
          # The summary is written even when the harness ends non-zero; the step then keeps the harness's exit code (pipefail). With no summary (the harness was killed) the progress lines go to the summary.
          rc=0
          node experiments/windows-appcontainer/run-experiment.mjs --out "$RUNNER_TEMP/appc-out" --mode session0 --timeout-ms 15000 2>&1 | node scripts/redact-log.mjs || rc=$?
          if [ -f "$RUNNER_TEMP/appc-out/session0.md" ]; then cat "$RUNNER_TEMP/appc-out/session0.md" >> "$GITHUB_STEP_SUMMARY"; elif [ -f "$RUNNER_TEMP/appc-out/session0.progress" ]; then tail -n 80 "$RUNNER_TEMP/appc-out/session0.progress" | node scripts/redact-log.mjs >> "$GITHUB_STEP_SUMMARY"; fi
          exit "$rc"
      - name: Child-program ladder as the runner service
        shell: bash
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        timeout-minutes: 25
        run: |
          mkdir -p "$RUNNER_TEMP/appc-out"
          # The summary is written even when the harness ends non-zero; the step then keeps the harness's exit code (pipefail).
          rc=0
          node experiments/windows-appcontainer/run-experiment.mjs --out "$RUNNER_TEMP/appc-out" --mode spawn --timeout-ms 15000 2>&1 | node scripts/redact-log.mjs || rc=$?
          if [ -f "$RUNNER_TEMP/appc-out/spawn.md" ]; then cat "$RUNNER_TEMP/appc-out/spawn.md" >> "$GITHUB_STEP_SUMMARY"; fi
          exit "$rc"
      # Card A03b slice 3/4: the PRODUCT launcher as the runner service: `info` (does the container profile come up with no one signed in?) and the ten containment cases of card G05 through the native
      # backend, the same commands as the hosted job. Installing the launcher (an account, folder ACLs) is not done here: that needs a separate go-ahead.
      - name: Product launcher info as the runner service
        shell: bash
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          mkdir -p "$RUNNER_TEMP/appc-out"
          rc=0
          "$RUNNER_TEMP/verified-launchers/nn-launcher.exe" info --name NimbleNewtProductCheck > "$RUNNER_TEMP/product-info.json" || rc=$?
          node scripts/redact-log.mjs < "$RUNNER_TEMP/product-info.json" | tee "$RUNNER_TEMP/appc-out/product-info.redacted.txt"
          { echo "## Product launcher info (own Windows runner, service)"; echo '```'; cat "$RUNNER_TEMP/appc-out/product-info.redacted.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          grep -q '"ok":true' "$RUNNER_TEMP/product-info.json"
      - name: G05 containment cases through the native backend (one confined start, node runner)
        shell: bash
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        timeout-minutes: 20
        # A profile name used only by this job (not the product's default NimbleNewtAgent), so the clean-up step below can remove it without touching anything else.
        env:
          NIMBLENEWT_WIN_LAUNCHER: ${{ runner.temp }}\verified-launchers\nn-launcher.exe
          NIMBLENEWT_WIN_CONTROL_DIR: ${{ runner.temp }}\nn-native
          NIMBLENEWT_WIN_PROFILE: NimbleNewtOwnRunnerG05
        run: |
          mkdir -p "$RUNNER_TEMP/appc-out/g05-native"
          rc=0
          node --import ./scripts/offline-guard.mjs scripts/containment-evidence.mjs run --out "$RUNNER_TEMP/appc-out/g05-native" --redact 2>&1 | node scripts/redact-log.mjs | tee "$RUNNER_TEMP/g05-native.log" || rc=$?
          { echo "## G05 containment cases, native backend (own Windows runner, service)"; echo '```'; tail -n 20 "$RUNNER_TEMP/g05-native.log" 2>/dev/null || echo "no output"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      # `info` and the G05 backend each create a container profile in the runner service's account and the product launcher never deletes one (the experiment harness steps above remove their own).
      # Both names are used only by this job; they are removed here with the verified experiment launcher (same source, which has `delete-profile`), hashed once more first, so the run leaves no profile
      # behind on the owner's machine. A profile that cannot be removed is reported, not fatal.
      - name: Remove the container profiles this job made
        shell: bash
        if: ${{ always() && steps.verify.outcome == 'success' }}
        timeout-minutes: 5
        env:
          EXPECT_EXPERIMENT: ${{ needs.hosted.outputs.experiment_sha256 }}
        run: |
          exe=experiments/windows-appcontainer/launcher/target/release/nn-appc-launcher.exe
          got="$(sha256sum -b < "$exe" | cut -d' ' -f1)"
          if [ "$got" != "$EXPECT_EXPERIMENT" ]; then echo "::error::$exe has SHA-256 $got, the hosted job built $EXPECT_EXPERIMENT; not run"; exit 1; fi
          for n in NimbleNewtProductCheck NimbleNewtOwnRunnerG05; do
            rc=0; out="$("$exe" delete-profile --name "$n" 2>&1)" || rc=$?
            if [ "$rc" -eq 0 ]; then echo "removed the container profile $n"; else echo "::warning::the container profile $n was not removed (exit $rc): $(printf '%s\n' "$out" | node scripts/redact-log.mjs | tail -n 1)"; fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-appcontainer-own-runner
          path: ${{ runner.temp }}/appc-out
          if-no-files-found: warn
          retention-days: 90
