          try {
            if (Get-LocalUser -Name $name -ErrorAction SilentlyContinue) { Fail "the generated account name $name is already in use"; exit 1 }
            foreach ($p in @($root, $profileDir, (Join-Path $env:ProgramFiles 'NimbleNewt'), (Join-Path $env:ProgramData 'NimbleNewt'))) { if (Test-Path -LiteralPath $p) { Fail "$p exists before the run"; exit 1 } }
            $usersBefore = @(Get-LocalUser | ForEach-Object { $_.Name } | Sort-Object)
            $adminsBefore = (Get-GroupFacts $adminSid 'none').All
            $groupUsersBefore = (Get-GroupFacts $usersSid 'none').All
            New-Item -ItemType Directory -Path $src -Force | Out-Null
            Copy-Item -LiteralPath $product -Destination (Join-Path $src 'nn-launcher.exe')
            $exe = Join-Path $src 'nn-launcher.exe'
            $h = Get-Hex $exe
            if ($h.Length -ne 64) { Fail 'the hash was not computed'; exit 1 }
            $paths = "-AccountName $name -InstallDir '$d1' -DataDir '$d2'"
            # 1. real Install
            $i1 = Run-Installer 'install' "-Action Install -LauncherPath '$exe' -ExpectedSha256 $h -AllowUnsigned $paths -Confirm:`$false"
            Assert-Run $i1 'Install' 0 @('Install finished', 'WARNING: installing an UNSIGNED launcher')
            # 2. real Verify, then facts read with .NET and the system tools
            $v1 = Run-Installer 'verify-1' "-Action Verify $paths"
            Assert-VerifyClean $v1 'Verify after Install'
            [System.IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, "## Installer real Install, Verify, Uninstall (hosted Windows, throw-away account)`n`n### Verify after Install`n``````text`n$($v1.Text)`n```````n")
            $user = Get-LocalUser -Name $name -ErrorAction SilentlyContinue
            if ($null -eq $user) { Fail 'the account does not exist after Install'; exit 1 }
            $sid = $user.SID.Value
            if ($user.Description -ne $marker) { Fail 'the account has no installer marker' }
            if (-not $user.Enabled) { Fail 'the account is disabled' }
            if (-not (Get-GroupFacts $usersSid $sid).Has) { Fail 'the account is not a member of Users' }
            if ((Get-GroupFacts $adminSid $sid).Has) { Fail 'the account is a member of Administrators' }
            $held = @(Get-Rights $sid)
            $want = @('SeBatchLogonRight', 'SeDenyInteractiveLogonRight', 'SeDenyNetworkLogonRight', 'SeDenyRemoteInteractiveLogonRight')
            Write-Host "account rights by secedit: $($held -join ', ')"
            if ((($held | Sort-Object) -join '|') -ne (($want | Sort-Object) -join '|')) { Fail "the account holds [$($held -join ', ')], expected [$($want -join ', ')]" }
            Test-Folder $d1 'install' $sid; Test-Folder $d2 'data' $sid; Test-Folder $ctl 'control' $sid
            $placed = Join-Path $d1 'nn-launcher.exe'
            if (-not [System.IO.File]::Exists($placed)) { Fail 'the launcher was not placed' } elseif ((Get-Hex $placed) -ne $h) { Fail 'the placed launcher differs from the expected hash' }
            $envFile = Join-Path $d2 'worker.env'
            if (-not [System.IO.File]::Exists($envFile)) { Fail 'worker.env is missing' } else {
              $lines = @(Get-Content -LiteralPath $envFile | Where-Object { $_.Trim().Length -gt 0 })
              $pre = 'NIMBLENEWT_WIN_'
              $wantEnv = @("${pre}CONTAINER=lpac", "${pre}CONTROL_DIR=$ctl", "${pre}LAUNCHER=$placed", "${pre}PROFILE=$profileName")
              if ((($lines | Sort-Object) -join '|') -cne (($wantEnv | Sort-Object) -join '|')) { Fail "worker.env is not exactly the four expected lines: $($lines -join ' / ')" }
              if (($lines -join "`n") -match '(?i)passw|secret|token|credential|api.?key') { Fail 'worker.env holds a secret-looking word' }
            }
            $manifestFile = Join-Path $d2 'install-manifest.json'
            if (-not [System.IO.File]::Exists($manifestFile)) { Fail 'the manifest is missing' } else {
              $mt = Get-Content -LiteralPath $manifestFile -Raw
              try { $m = $mt | ConvertFrom-Json } catch { Fail 'the manifest does not parse'; $m = $null }
              if ($null -ne $m) {
                if ($m.schema -ne 'nimblenewt.native-install/1' -or $m.account -ne $name -or $m.accountSid -ne $sid -or $m.launcherSha256 -ne $h.ToUpperInvariant()) { Fail 'the manifest does not name this install' }
              }
              if ($mt -match '(?i)passw|secret|token|credential') { Fail 'the manifest holds a secret-looking word' }
            }
            # 3. a second Install repairs and adds nothing; Verify is still clean
            $i2 = Run-Installer 'install-again' "-Action Install -LauncherPath '$exe' -ExpectedSha256 $h -AllowUnsigned $paths -Confirm:`$false"
            Assert-Run $i2 'second Install' 0 @('Install finished')
            Assert-VerifyClean (Run-Installer 'verify-2' "-Action Verify $paths") 'Verify after the second Install'
            # 4. an Uninstall aimed at folders the install did not make is refused and changes nothing
            $bad = Run-Installer 'uninstall-wrong-folder' "-Action Uninstall -AccountName $name -InstallDir '$d1' -DataDir '$other' -Confirm:`$false"
            if ($bad.Code -eq 0 -or $bad.Text.IndexOf('No manifest at', [System.StringComparison]::Ordinal) -lt 0) { Fail "Uninstall with another -DataDir was not refused (exit $($bad.Code))" }
            if ($null -eq (Get-LocalUser -Name $name -ErrorAction SilentlyContinue) -or -not [System.IO.Directory]::Exists($d1) -or -not [System.IO.Directory]::Exists($d2)) { Fail 'the refused Uninstall changed something' }
            # 5. the real Uninstall, then nothing may be left
            $un = Run-Installer 'uninstall' "-Action Uninstall $paths -Confirm:`$false"
            Assert-Run $un 'Uninstall' 0 @('Uninstall finished')
            [System.IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, "### Uninstall`n``````text`n$($un.Text)`n```````n")
            if ($null -ne (Get-LocalUser -Name $name -ErrorAction SilentlyContinue)) { Fail 'Uninstall left the account' }
            foreach ($p in @($d1, $d2, $profileDir)) { if (Test-Path -LiteralPath $p) { Fail "Uninstall left $p" } }
            if (@(Get-CimInstance Win32_UserProfile | Where-Object { $_.SID -eq $sid }).Count -gt 0) { Fail 'Uninstall left the profile record' }
            $rightsLeft = @(Get-Rights $sid)
            if ($rightsLeft.Count -gt 0) { Fail "Uninstall left account rights: $($rightsLeft -join ', ')" }
            $v3 = Run-Installer 'verify-3' "-Action Verify $paths"
            Assert-Run $v3 'Verify after Uninstall' 1 @('FAIL  the account exists', 'RESULT:')
            # the rest of the machine is as it was
            if ((@(Get-LocalUser | ForEach-Object { $_.Name } | Sort-Object) -join '|') -ne ($usersBefore -join '|')) { Fail 'the list of local users differs from before the run' }
            if (((Get-GroupFacts $adminSid 'none').All -join '|') -ne ($adminsBefore -join '|')) { Fail 'the members of Administrators differ from before the run' }
            if (((Get-GroupFacts $usersSid 'none').All -join '|') -ne ($groupUsersBefore -join '|')) { Fail 'the members of Users differ from before the run' }
            foreach ($p in @((Join-Path $env:ProgramFiles 'NimbleNewt'), (Join-Path $env:ProgramData 'NimbleNewt'))) { if (Test-Path -LiteralPath $p) { Fail "$p appeared" } }
          } catch {
            Fail "the step stopped: $($_ | Out-String)"
          } finally {
            # Whatever happened: remove by the exact generated name and folder, and say what was still there.
            $left = @()
            try {
              if ($name -match '^nnprobe[a-z0-9]{6}$') {
                $u = Get-LocalUser -Name $name -ErrorAction SilentlyContinue
                if ($null -ne $u) { $left += "the account $name"; if ($u.Description -eq $marker) { Remove-LocalUser -Name $name } }
                foreach ($p in @($d1, $d2, $profileDir)) { if (Test-Path -LiteralPath $p) { $left += $p } }
                if ($root -ceq (Join-Path $env:RUNNER_TEMP ('nn-real-' + $tag))) { Wipe $root }
                if ($profileDir -ceq "$env:SystemDrive\Users\$name") { Wipe $profileDir }
              }
            } catch { Fail "the cleanup failed: $($_ | Out-String)" }
            if ($left.Count -gt 0) { Fail "Uninstall left $($left -join '; ') (removed by the cleanup)" }
            Write-Host 'the throw-away account and folders are removed'
          }
          if ($script:failed) { exit 1 }
          exit 0
      # Safety net for the step above, in case it was killed (a time-out or a cancelled run skips its `finally`): removes, by the exact name and folder that step generated and wrote to its outputs, anything
      # still there, and FAILS the job if something was ("Uninstall left ..."). It only ever touches a name of the form nnprobe + 6 lower-case letters or digits and the folder RUNNER_TEMP\nn-real-<same 6>,
      # and it refuses to run anywhere but a GitHub-hosted runner. No wildcard anywhere.
      - name: "Installer real run: remove anything left (hosted runner only)"
        id: installer_real_cleanup
        shell: powershell
        if: always()
        timeout-minutes: 5
        env:
          NN_NAME: ${{ steps.installer_real.outputs.name }}
          NN_ROOT: ${{ steps.installer_real.outputs.root }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted') { Write-Output '::error::this step removes a real local user and runs only on a GitHub-hosted runner'; exit 1 }
          $name = $env:NN_NAME; $root = $env:NN_ROOT
          if ([string]::IsNullOrEmpty($name) -and [string]::IsNullOrEmpty($root)) { Write-Output 'the install step made no names: nothing to remove'; exit 0 }
          if ($name -cnotmatch '^nnprobe[a-z0-9]{6}$' -or $root -cne (Join-Path $env:RUNNER_TEMP ('nn-real-' + $name.Substring(7)))) { Write-Output '::error::the names from the install step are not the generated ones; nothing was removed'; exit 1 }
          $left = @()
          $u = Get-LocalUser -Name $name -ErrorAction SilentlyContinue
          if ($null -ne $u) { $left += "the account $name"; Remove-LocalUser -Name $name }
          $profileDir = "$env:SystemDrive\Users\$name"
          foreach ($p in @($root, $profileDir)) { if ([System.IO.Directory]::Exists($p)) { $left += $p; & cmd.exe /c rmdir /s /q "$p" | Out-Null } }
          if ($left.Count -gt 0) { Write-Output "::error::Uninstall left $($left -join '; ') (removed now)"; exit 1 }
          Write-Output 'nothing left behind'
          exit 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-appcontainer-hosted
          path: ${{ runner.temp }}/appc-out
          if-no-files-found: warn
          retention-days: 90

  own-runner:
    name: Own Windows runner (service)
    needs: hosted
    # `!cancelled()` (not the default "every needed job succeeded"): an experiment step of the hosted job that fails (a finding is allowed to be a failure) must not stop this run, but a hosted job that
    # built no launcher must: `launchers == 'ok'` is set only when both programs were staged with a matching release record. Unticked, other repository or other branch: skipped as before.
    if: ${{ !cancelled() && needs.hosted.outputs.launchers == 'ok' && inputs.own_runner == true && github.repository == 'rkcth/NimbleNewt' && github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, nimblenewt-windows]
    timeout-minutes: 45
    concurrency:
      group: windows-appcontainer-own-runner
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Same Git Bash step as own-hardware.yml (a plain `shell: bash` can resolve to the WSL launcher on this runner).
      - name: Use Git Bash for bash steps
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @()
          $git = Get-Command git.exe -CommandType Application -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($git) { $root = Split-Path (Split-Path $git.Source -Parent) -Parent; foreach ($r in @($root, (Split-Path $root -Parent))) { if ($r) { $candidates += Join-Path $r 'bin' } } }
          $candidates += Join-Path $env:ProgramFiles 'Git\bin'
          $dir = $candidates | Where-Object { Test-Path -LiteralPath (Join-Path $_ 'bash.exe') } | Select-Object -First 1
          if (-not $dir) { Write-Output "::error::Git Bash (Git for Windows bin\bash.exe) was not found; install Git for Windows (docs/nimblenewt/own-hardware-runners.md)"; exit 1 }
          & (Join-Path $dir 'bash.exe') --noprofile --norc -c 'echo bash for this job: $BASH $BASH_VERSION'
          if ($LASTEXITCODE -ne 0) { exit 1 }
          [System.IO.File]::AppendAllText($env:GITHUB_PATH, "$dir`n", (New-Object System.Text.UTF8Encoding $false))
      - run: npm ci
      - run: npm run build
      # No Rust here. The launchers are the ones the hosted job built from this commit. Nothing below starts either program until the check has passed; the programs are placed (for the harness's default
      # path and for the product backend) only after their hashes match the hosted job's outputs, and the placed copies are hashed again.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-appcontainer-launchers
          path: ${{ runner.temp }}/downloaded-launchers
      # Every later step that starts a launcher runs only when this step succeeded (`steps.verify.outcome == 'success'`, never a bare always()).
      - name: Verify the downloaded launchers against the hosted job's hashes, then place them
        id: verify
        shell: bash
        env:
          EXPECT_EXPERIMENT: ${{ needs.hosted.outputs.experiment_sha256 }}
          EXPECT_PRODUCT: ${{ needs.hosted.outputs.product_sha256 }}
        run: |
          set -eu
          case "$EXPECT_EXPERIMENT" in *[!0-9a-f]*|"") echo "::error::no hash for the experiment launcher from the hosted job"; exit 1;; esac
          case "$EXPECT_PRODUCT" in *[!0-9a-f]*|"") echo "::error::no hash for the product launcher from the hosted job"; exit 1;; esac
          [ "${#EXPECT_EXPERIMENT}" -eq 64 ] && [ "${#EXPECT_PRODUCT}" -eq 64 ] || { echo "::error::a hash from the hosted job is not 64 hex digits"; exit 1; }
          src="$RUNNER_TEMP/downloaded-launchers"; ok="$RUNNER_TEMP/verified-launchers"; dest=experiments/windows-appcontainer/launcher/target/release
          rm -rf "$ok"
          # from standard input: with a file name containing a backslash (any $RUNNER_TEMP path here) GNU sha256sum writes "\<hash>"
          check() { got="$(sha256sum -b < "$1" | cut -d' ' -f1)"; if [ "$got" != "$2" ]; then echo "::error::$1 has SHA-256 $got, the hosted job built $2; nothing was run"; exit 1; fi; }
          check "$src/nn-appc-launcher.exe" "$EXPECT_EXPERIMENT"
          check "$src/nn-launcher.exe" "$EXPECT_PRODUCT"
          node scripts/native-launcher.mjs verify --file "$src/nn-launcher.exe" --record "$src/nn-launcher.record.json"
          mkdir -p "$ok" "$dest"
          cp "$src/nn-launcher.exe" "$ok/nn-launcher.exe"; cp "$src/nn-launcher.record.json" "$ok/nn-launcher.record.json"; cp "$src/nn-appc-launcher.exe" "$dest/nn-appc-launcher.exe"
          check "$ok/nn-launcher.exe" "$EXPECT_PRODUCT"; check "$dest/nn-appc-launcher.exe" "$EXPECT_EXPERIMENT"
          echo "launchers verified: experiment $EXPECT_EXPERIMENT, product $EXPECT_PRODUCT (built by CI from $GITHUB_SHA)"
          { echo "## Launchers on this machine"; echo "Built by the hosted job from commit \`$GITHUB_SHA\` and verified before use: experiment \`$EXPECT_EXPERIMENT\`, product \`$EXPECT_PRODUCT\`. Unsigned; nothing was built here."; } >> "$GITHUB_STEP_SUMMARY"
      - name: Containment cases as the runner service (no window, no prompt)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/appc-out"
          # The summary is written even when the harness ends non-zero; the step then keeps the harness's exit code (pipefail).
          rc=0
          node experiments/windows-appcontainer/run-experiment.mjs --out "$RUNNER_TEMP/appc-out" --mode cases --timeout-ms 90000 2>&1 | node scripts/redact-log.mjs || rc=$?
          if [ -f "$RUNNER_TEMP/appc-out/cases.md" ]; then cat "$RUNNER_TEMP/appc-out/cases.md" >> "$GITHUB_STEP_SUMMARY"; fi
          exit "$rc"
      # Round 5: the run that answers why the container's programs end with 0xC0000142 as a service; gated on the verify step like every step that starts a launcher.
      - name: Session 0 diagnostic, round 5, as the runner service
        shell: bash
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        timeout-minutes: 25
        run: |
          mkdir -p "$RUNNER_TEMP/appc-out"
          # The summary is written even when the harness ends non-zero; the step then keeps the harness's exit code (pipefail). With no summary (the harness was killed) the progress lines go to the summary.
          rc=0
          node experiments/windows-appcontainer/run-experiment.mjs --out "$RUNNER_TEMP/appc-out" --mode session0 --timeout-ms 15000 2>&1 | node scripts/redact-log.mjs || rc=$?
          if [ -f "$RUNNER_TEMP/appc-out/session0.md" ]; then cat "$RUNNER_TEMP/appc-out/session0.md" >> "$GITHUB_STEP_SUMMARY"; elif [ -f "$RUNNER_TEMP/appc-out/session0.progress" ]; then tail -n 80 "$RUNNER_TEMP/appc-out/session0.progress" | node scripts/redact-log.mjs >> "$GITHUB_STEP_SUMMARY"; fi
          exit "$rc"
      - name: Child-program ladder as the runner service
        shell: bash
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        timeout-minutes: 25
        run: |
          mkdir -p "$RUNNER_TEMP/appc-out"
          # The summary is written even when the harness ends non-zero; the step then keeps the harness's exit code (pipefail).
          rc=0
          node experiments/windows-appcontainer/run-experiment.mjs --out "$RUNNER_TEMP/appc-out" --mode spawn --timeout-ms 15000 2>&1 | node scripts/redact-log.mjs || rc=$?
          if [ -f "$RUNNER_TEMP/appc-out/spawn.md" ]; then cat "$RUNNER_TEMP/appc-out/spawn.md" >> "$GITHUB_STEP_SUMMARY"; fi
          exit "$rc"
      # Card A03b slice 3/4: the PRODUCT launcher as the runner service: `info` (does the container profile come up with no one signed in?) and the ten containment cases of card G05 through the native
      # backend, the same commands as the hosted job. Installing the launcher (an account, folder ACLs) is not done here: that needs a separate go-ahead.
      - name: Product launcher info as the runner service
        shell: bash
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          mkdir -p "$RUNNER_TEMP/appc-out"
          rc=0
          # a fresh per-run name and a record file in a folder made here (the product accepts nothing else); both are kept in a file so the clean-up step can delete the profile if `info` was stopped before it did
          info_name="NimbleNewtRun-$(node -e "process.stdout.write(require('crypto').randomBytes(8).toString('hex'))")"
          mkdir -p "$RUNNER_TEMP/profile-records"
          info_record="$(cygpath -w "$RUNNER_TEMP/profile-records/$info_name.sid")"
          printf '%s\n%s\n' "$info_name" "$info_record" > "$RUNNER_TEMP/product-info-run.txt"
          "$RUNNER_TEMP/verified-launchers/nn-launcher.exe" info --name "$info_name" --profile-record "$info_record" > "$RUNNER_TEMP/product-info.json" || rc=$?
          node scripts/redact-log.mjs < "$RUNNER_TEMP/product-info.json" | tee "$RUNNER_TEMP/appc-out/product-info.redacted.txt"
          { echo "## Product launcher info (own Windows runner, service)"; echo '```'; cat "$RUNNER_TEMP/appc-out/product-info.redacted.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          grep -q '"ok":true' "$RUNNER_TEMP/product-info.json"
          # as a service in session 0 this is the check that matters: a private window station and desktop can be made for the container
          grep -q '"windowStation":"private"' "$RUNNER_TEMP/product-info.json"
          grep -q '"windowStationOk":true' "$RUNNER_TEMP/product-info.json"
          # the throw-away profile was deleted again (profileGone is the not yet measured reading, so a miss here fails this step but never hides the lines above)
          grep -q '"profileDeleted":true' "$RUNNER_TEMP/product-info.json"
          grep -q '"profileGone":true' "$RUNNER_TEMP/product-info.json"
      - name: G05 containment cases through the native backend (one confined start, node runner)
        shell: bash
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        timeout-minutes: 20
        # No profile name is set here: the backend makes a fresh NimbleNewtRun-<hex> profile for the run, records it under the control folder, deletes it when the run ends and sweeps a leftover from its own records at the next start
        # (NIMBLENEWT_WIN_PROFILE is retired and ignored). Nothing here can be cleaned up by name from the workflow, so this job's clean-up step does not try.
        env:
          NIMBLENEWT_WIN_LAUNCHER: ${{ runner.temp }}\verified-launchers\nn-launcher.exe
          NIMBLENEWT_WIN_CONTROL_DIR: ${{ runner.temp }}\nn-native
        run: |
          mkdir -p "$RUNNER_TEMP/appc-out/g05-native"
          rc=0
          node --import ./scripts/offline-guard.mjs scripts/containment-evidence.mjs run --out "$RUNNER_TEMP/appc-out/g05-native" --redact 2>&1 | node scripts/redact-log.mjs | tee "$RUNNER_TEMP/g05-native.log" || rc=$?
          { echo "## G05 containment cases, native backend (own Windows runner, service)"; echo '```'; tail -n 20 "$RUNNER_TEMP/g05-native.log" 2>/dev/null || echo "no output"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      # The experiment harness steps above remove their own profiles. The product `info` step deletes its throw-away per-run profile itself and the G05 backend deletes and sweeps its own, so nothing is removed by a fixed name any
      # more. This step does two things: it removes a leftover window station entry of the experiment's container (the experiment launcher, hashed again first), and, if the product `info` step was stopped before it deleted its profile,
      # deletes that one profile with the product launcher (hashed again first) and the proof the launcher requires: its name, its SID (from the JSON `info` printed) and its record file. A profile that cannot be removed is reported, not fatal.
      - name: Remove the container profiles this job made
        shell: bash
        if: ${{ always() && steps.verify.outcome == 'success' }}
        timeout-minutes: 5
        env:
          EXPECT_EXPERIMENT: ${{ needs.hosted.outputs.experiment_sha256 }}
          EXPECT_PRODUCT: ${{ needs.hosted.outputs.product_sha256 }}
        run: |
          exe=experiments/windows-appcontainer/launcher/target/release/nn-appc-launcher.exe
          got="$(sha256sum -b < "$exe" | cut -d' ' -f1)"
          if [ "$got" != "$EXPECT_EXPERIMENT" ]; then echo "::error::$exe has SHA-256 $got, the hosted job built $EXPECT_EXPERIMENT; not run"; exit 1; fi
          # Round 5: if the session 0 harness was stopped before its own clean-up, an entry for the experiment's container can remain on this service's window station and desktop. desktop-revoke
          # removes only that container's entries (the SID is derived from the name, no profile is made; with nothing to remove nothing is written).
          rc=0; out="$("$exe" desktop-revoke --name NimbleNewtExperiment 2>/dev/null)" || rc=$?
          if [ "$rc" -eq 0 ]; then echo "window station and desktop: no entry left for the experiment container"; else echo "::warning::desktop-revoke ended with exit $rc: $(printf '%s\n' "$out" | node scripts/redact-log.mjs | tail -n 1)"; fi
          prod="$RUNNER_TEMP/verified-launchers/nn-launcher.exe"
          if [ -s "$RUNNER_TEMP/product-info-run.txt" ] && [ -s "$RUNNER_TEMP/product-info.json" ]; then
            got="$(sha256sum -b < "$prod" | cut -d' ' -f1)"
            if [ "$got" != "$EXPECT_PRODUCT" ]; then echo "::error::$prod has SHA-256 $got, the hosted job built $EXPECT_PRODUCT; not run"; exit 1; fi
            pname="$(head -n 1 "$RUNNER_TEMP/product-info-run.txt")"; prec="$(tail -n 1 "$RUNNER_TEMP/product-info-run.txt")"
            psid="$(node -e "try{const j=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'));process.stdout.write(j.profileGone===true?'':String(j.containerSid||''))}catch{}" "$RUNNER_TEMP/product-info.json")"
            if [ -z "$psid" ]; then echo "the product info profile: nothing left to delete"; else
              rc=0; out="$("$prod" delete-profile --name "$pname" --sid "$psid" --profile-record "$prec" 2>&1)" || rc=$?
              if [ "$rc" -eq 0 ]; then echo "removed the product info container profile"; else echo "::warning::the product info container profile was not removed (exit $rc): $(printf '%s\n' "$out" | node scripts/redact-log.mjs | tail -n 1)"; fi
            fi
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-appcontainer-own-runner
          path: ${{ runner.temp }}/appc-out
          if-no-files-found: warn
          retention-days: 90
