name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22.19.0", "24.21.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      # The Linux sandbox launcher (card A03) is tested against real bubblewrap. Ubuntu runners restrict unprivileged user namespaces, which
      # bubblewrap needs, so lift that restriction for this job and make the sandbox tests required: a Linux run where nothing could be
      # confined must fail rather than skip.
      - name: Install bubblewrap and allow user namespaces
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          echo "NIMBLENEWT_REQUIRE_SANDBOX=1" >> "$GITHUB_ENV"
      # macOS: the Seatbelt sandbox tests (card A03) must run too; sandbox-exec ships with the system.
      - name: Require the macOS sandbox tests
        if: runner.os == 'macOS'
        run: echo "NIMBLENEWT_REQUIRE_SANDBOX=1" >> "$GITHUB_ENV"
      # Install scripts are disabled by .npmrc; the lockfile is authoritative.
      - run: npm ci
      # Builds, checks package boundaries and the license inventory, then runs all tests under the
      # in-process offline guard (scripts/offline-guard.mjs).
      - name: npm test
        shell: bash
        run: set -o pipefail; npm test 2>&1 | tee test.log
      # Job logs need authentication to read; surface the tail of a failure as an annotation instead.
      - name: Annotate test failure
        if: failure()
        run: node scripts/ci-annotate.mjs test.log
      # The generated plan files must match their generator (task-plan.json/md come from scripts/generate_task_plan.py).
      - name: Generated plan files are current
        if: runner.os == 'Linux'
        run: python3 scripts/generate_task_plan.py && git diff --exit-code docs/
      # The suite must not rewrite tracked files (e.g. a stale generated inventory).
      - run: git diff --exit-code
      # Real network isolation: rerun the suite in a network namespace with no connectivity. This covers
      # child processes and native code that the in-process guard cannot.
      - name: Rerun with the network disabled
        if: runner.os == 'Linux'
        # A new namespace starts with the loopback interface down; bring it up for local-only tests.
        run: >-
          sudo unshare --net -- sh -c
          'ip link set lo up && exec setpriv --reuid="$1" --regid="$2" --clear-groups env "PATH=$3" "HOME=$4" CI=true npm test'
          sh "$(id -u)" "$(id -g)" "$PATH" "$HOME"
