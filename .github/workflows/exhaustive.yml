name: Exhaustive tests

# The exhaustive tier (card X11): every backend, the long qualification runs, three operating systems and two Node versions, the controller's tests split into three shards
# so that no job runs much longer than half an hour on Linux (Windows runners are slower; see timeout-minutes). It is run by hand (Actions > Exhaustive tests > Run workflow) and on version tags, for milestones and releases and as the
# evidence for card status changes. The typical tier that every push runs is ci.yml.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }} / shard ${{ matrix.shard }}
    runs-on: ${{ matrix.os }}
    # 75: the suite grew, and Windows jobs took 45-50 minutes in run 43086209106 (one was cancelled at 50 while its tests were still passing).
    # 100: Windows jobs now take 43-60 minutes and one (Windows, Node 22, shard 1) hit the 75-minute limit while its tests were still passing in run 43645565325.
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22.19.0", "24.21.0"]
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      # The Linux sandbox launcher (card A03) is tested against real bubblewrap. Ubuntu runners restrict unprivileged user namespaces, which
      # bubblewrap needs, so lift that restriction for this job and make the sandbox tests required: a Linux run where nothing could be
      # confined must fail rather than skip.
      - name: Install bubblewrap and allow user namespaces
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          echo "NIMBLENEWT_REQUIRE_SANDBOX=1" >> "$GITHUB_ENV"
      # macOS: the Seatbelt sandbox tests (card A03) must run too; sandbox-exec ships with the system.
      - name: Require the macOS sandbox tests
        if: runner.os == 'macOS'
        run: echo "NIMBLENEWT_REQUIRE_SANDBOX=1" >> "$GITHUB_ENV"
      # Install scripts are disabled by .npmrc; the lockfile is authoritative.
      - run: npm ci
      # Builds, checks package boundaries and the license inventory, then runs all tests under the
      # in-process offline guard (scripts/offline-guard.mjs).
      - name: npm test
        shell: bash
        run: set -o pipefail; node scripts/test-shard.mjs ${{ matrix.shard }}/3 2>&1 | tee test.log
      # Job logs need authentication to read; surface the tail of a failure as an annotation instead.
      - name: Annotate test failure
        if: failure()
        run: node scripts/ci-annotate.mjs test.log
      # The generated plan files must match their generator (task-plan.json/md come from scripts/generate_task_plan.py).
      - name: Generated plan files are current
        if: runner.os == 'Linux' && matrix.shard == 1
        run: python3 scripts/generate_task_plan.py && git diff --exit-code docs/
      # The suite must not rewrite tracked files (e.g. a stale generated inventory).
      - run: git diff --exit-code
      # Real network isolation: rerun the suite in a network namespace with no connectivity. This covers
      # child processes and native code that the in-process guard cannot.
      - name: Rerun with the network disabled
        if: runner.os == 'Linux'
        # A new namespace starts with the loopback interface down; bring it up for local-only tests.
        run: >-
          sudo unshare --net -- sh -c
          'ip link set lo up && exec setpriv --reuid="$1" --regid="$2" --clear-groups env "PATH=$3" "HOME=$4" CI=true node scripts/test-shard.mjs "$5"/3'
          sh "$(id -u)" "$(id -g)" "$PATH" "$HOME" ${{ matrix.shard }}

  # Card G05: the isolation-boundary proof on each operating system's hosted runner (Rob, 2026-11-18: GitHub Actions runners count as the real OS runs). It runs the containment
  # suite through the production launcher and uploads containment-<platform>.json (schema nimblenewt.containment/1, read by `containment-evidence.mjs gate` and Y02's gate).
  # Linux (bubblewrap) and macOS (Seatbelt) must hold every case. A hosted Windows runner cannot run Windows Sandbox (a client feature that needs nested virtualization), so that
  # cell records every case not_run with the reason and passes as an honest skip (--allow-unavailable); the release gate still blocks Windows until a host with Windows Sandbox runs it.
  containment:
    name: G05 containment / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.19.0"
      - name: Install bubblewrap and allow user namespaces
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      # Install scripts are disabled by .npmrc; the lockfile is authoritative.
      - run: npm ci
      - name: Run the containment suite
        shell: bash
        run: |
          set -o pipefail
          ALLOW=""; if [ "$RUNNER_OS" = "Windows" ]; then ALLOW="--allow-unavailable"; fi
          node --import ./scripts/offline-guard.mjs scripts/containment-evidence.mjs run --out "$RUNNER_TEMP/g05" $ALLOW 2>&1 | tee "$RUNNER_TEMP/g05.log"
      - name: Summarize
        if: always()
        shell: bash
        run: |
          { echo "## G05 containment, ${{ matrix.os }}"; echo '```'; tail -n 20 "$RUNNER_TEMP/g05.log" 2>/dev/null || echo "no output"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: containment-${{ runner.os }}
          path: ${{ runner.temp }}/g05/containment-*.json
          if-no-files-found: warn
          retention-days: 90

  # Card Y02: the checkpoint's scenario set (scripts/y02-scenarios.json: escape and path tricks, resource limits, startup checks, the pre-commit gate, pause and stop, checked resume,
  # remote reconnect with epochs, idle subscriptions) through `y02-checkpoint.mjs run`, on the hosted Linux and macOS runners, on the same commit as the rest of this workflow, with the
  # sandbox required. It uploads y02-scenarios-<platform>.json, which `y02-checkpoint.mjs gate` reads beside the containment reports above, the QA records (qa.yml) and the CI run ids.
  # Windows is not here: its scenario set needs the real Windows Sandbox, which a hosted runner cannot run; own-hardware.yml runs it on the owner's machine.
  y02-scenarios:
    name: Y02 scenarios / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.19.0"
      - name: Install bubblewrap and allow user namespaces
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      # Install scripts are disabled by .npmrc; the lockfile is authoritative.
      - run: npm ci
      # The runner sets NIMBLENEWT_REQUIRE_SANDBOX=1 for every scenario file itself, so a host that cannot confine fails instead of skipping.
      - name: Run the Y02 scenario set
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/y02"
          node scripts/y02-checkpoint.mjs run --out "$RUNNER_TEMP/y02" 2>&1 | tee "$RUNNER_TEMP/y02.log"
      - name: Summarize
        if: always()
        shell: bash
        run: |
          { echo "## Y02 scenarios, ${{ matrix.os }}"; echo '```'; grep -E "^[a-z0-9-]+: (pass|FAIL)|scenarios hold" "$RUNNER_TEMP/y02.log" 2>/dev/null | tail -n 20 || echo "no output"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: y02-scenarios-${{ runner.os }}
          path: ${{ runner.temp }}/y02/y02-scenarios-*.json
          if-no-files-found: warn
          retention-days: 90
